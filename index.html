<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双色球 · 勿忘草 Myosotis 摇奖机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(#b9cfe4, #e2ecf5);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #22334c; user-select: none;
  }
  /* 暗角：压住四角，画面更像镜头拍摄 */
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 240px 70px rgba(18,32,58,.30); }
  canvas { display: block; }
  #hud { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; pointer-events: none; }
  #title {
    font-size: 25px; font-weight: 700; letter-spacing: 4px;
    background: linear-gradient(90deg, #c62828, #d99214, #1e5bbf);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #results { display: flex; gap: 13px; justify-content: center; margin-top: 14px; }
  .slot {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: 800;
    background: rgba(255,255,255,.45);
    border: 2px dashed rgba(40,60,90,.28);
    color: rgba(40,60,90,.32); transition: all .25s;
  }
  .slot.filled { border-style: solid; color: #fff; box-shadow: 0 0 22px rgba(0,0,0,.5); }
  .slot.red.filled { background: radial-gradient(circle at 35% 30%, #ff7a6e, #c62828 70%); border-color: #ff9a8f; }
  .slot.blue.filled { background: radial-gradient(circle at 35% 30%, #6fa8ff, #0d47a1 70%); border-color: #9cc0ff; }
  .slot.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.2); } 100% { transform: scale(1); } }
  #phase { margin-top: 12px; font-size: 15px; color: #40597a; letter-spacing: 2px; min-height: 22px; }
  #phase.active { color: #b8620c; text-shadow: 0 0 12px rgba(255,180,80,.45); }
  #controls { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 10; }
  button {
    padding: 12px 34px; font-size: 17px; font-weight: 700; letter-spacing: 3px;
    border-radius: 28px; border: 1px solid rgba(255,255,255,.25);
    cursor: pointer; transition: all .2s; color: #fff;
  }
  #startBtn { background: linear-gradient(135deg, #e53935, #b71c1c); box-shadow: 0 4px 24px rgba(229,57,53,.45); }
  #startBtn:hover:not(:disabled) { transform: translateY(-2px); }
  #resetBtn { background: rgba(255,255,255,.6); color: #25354d; border-color: rgba(40,60,90,.2); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #tip { position: fixed; bottom: 10px; right: 16px; font-size: 12px; color: rgba(32,48,72,.45); z-index: 10; }
  #legend {
    position: fixed; top: 16px; left: 18px; font-size: 12.5px; line-height: 1.85;
    color: rgba(32,48,72,.68); z-index: 10;
  }
  #legend b { color: #14233a; }
</style>
</head>
<body>
<div id="vig"></div>
<div id="hud">
  <div id="title">双色球 · 勿忘草 Myosotis 摇奖机</div>
  <div id="results"></div>
  <div id="phase">点击「开始摇奖」</div>
</div>
<div id="legend">
  <div><b>真机复刻 · 法国 RYO CATTEAU「勿忘草」Myosotis</b></div>
  <div>整机 2.1m × 0.75m：底座 0.31（=搅拌轮盘外径） / 搅拌室 0.83 / 预览架 0.42</div>
  <div>① 号码球预览架：等长透明管环形排列插入球壳后半部，管底削尖</div>
  <div>② 球状搅拌室 Ø70cm：底部双盘逆向旋转搅拌（专利）</div>
  <div>③ 出球口档杆 → 出球轨道（开一颗、过一颗、关阀）</div>
  <div>④ 底座：PLC 按固定搅拌间隔控制出球</div>
</div>
<div id="controls">
  <button id="startBtn">开始摇奖</button>
  <button id="resetBtn">重 置</button>
</div>
<div id="tip">拖拽旋转视角 · 滚轮缩放</div>

<script>
/* 运行时错误直接显示在页面提示栏，避免整页黑掉无提示 */
window.addEventListener('error', e => {
  const p = document.getElementById('phase');
  if (p) { p.textContent = '⚠ 页面错误: ' + e.message; p.className = 'active'; }
});
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= 场景基础 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
/* ACES 色调映射：高光柔和滚降，画面不再「所有东西一样亮」的死白 */
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5b6e84);
scene.fog = new THREE.Fog(0x66788c, 42, 120);

/* 环境反射（PBR 质感的关键） */
const pmrem = new THREE.PMREMGenerator(renderer);
/* 自制影棚环境（equirect）：上蓝墙、中亮带、下深地面 + 三块灯箱亮斑，
   让玻璃球壳/金属件反射出「真实的影棚」，而不是 RoomEnvironment 的白盒子 */
{
  const envCv = document.createElement('canvas'); envCv.width = 1024; envCv.height = 512;
  const ec = envCv.getContext('2d');
  const eg = ec.createLinearGradient(0, 0, 0, 512);
  eg.addColorStop(0, '#2c3e52'); eg.addColorStop(0.46, '#5a7896'); eg.addColorStop(0.52, '#4a5a6a'); eg.addColorStop(1, '#1f2530');
  ec.fillStyle = eg; ec.fillRect(0, 0, 1024, 512);
  /* 灯箱：柔和径向渐变（中心亮、边缘化开），避免硬白矩形在玻璃上炸成反光斑 */
  const softBox = (x, y, w, h, a) => {
    const g = ec.createRadialGradient(x + w / 2, y + h / 2, 3, x + w / 2, y + h / 2, Math.max(w, h) * 0.7);
    g.addColorStop(0, `rgba(228,238,250,${a})`);
    g.addColorStop(1, 'rgba(228,238,250,0)');
    ec.fillStyle = g; ec.fillRect(x - w * 0.5, y - h * 0.5, w * 2, h * 2);
  };
  softBox(90, 42, 230, 105, 0.6);   /* 灯箱 1（左） */
  softBox(650, 34, 250, 115, 0.65); /* 灯箱 2（右） */
  softBox(390, 95, 170, 60, 0.35);  /* 灯箱 3（中，弱） */
  const envTex = new THREE.CanvasTexture(envCv);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
}

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3.4, 19.5);

/* 后期：轻辉光 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.45, 1.02);
composer.addPass(bloom);
/* 胶片颗粒 + 边缘色散：真实镜头都有微噪点，全画面丝般光滑反而假 */
/* 链尾输出通道：负责色调映射 + sRGB 编码（缺了它整个画面会发暗发灰） */
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.4, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 5;
controls.maxDistance = 40;

/* ================= 摇奖镜头聚焦（电视直播式：左机 → 右机 → 回全景） =================
   用一段平滑补间把主相机在「全景」与「单台机器特写」之间切换；
   补间进行时暂时禁用 OrbitControls，结束后恢复并重新同步。 */
const CAM_HOME = { pos: new THREE.Vector3(0, 3.4, 19.5), tgt: new THREE.Vector3(0, 3.4, 0) };
/* 单台机位：保持正面同向，仅平移 + 推进，构图与全景一致不翻转。
   推得更近（z 8.8→6.0），目标略抬高对准预览架/球壳上半部，特写能看清球轨道与预览管 */
const CAM_FOCUS = {
  red:      { pos: new THREE.Vector3(-3.8, 3.85, 7.5), tgt: new THREE.Vector3(-3.8, 3.7, 0.3) },
  blue:     { pos: new THREE.Vector3( 3.8, 3.85, 7.5), tgt: new THREE.Vector3( 3.8, 3.7, 0.3) },
  overview: CAM_HOME
};
const camTween = {
  active: false, t: 0, dur: 1.5,
  fromPos: new THREE.Vector3(), toPos: new THREE.Vector3(),
  fromTgt: new THREE.Vector3(), toTgt: new THREE.Vector3(),
  onDone: null
};
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function focusCamera(which, dur = 1.5, onDone = null) {
  const f = CAM_FOCUS[which];
  if (!f) return;
  camTween.fromPos.copy(camera.position);
  camTween.toPos.copy(f.pos);
  camTween.fromTgt.copy(controls.target);
  camTween.toTgt.copy(f.tgt);
  camTween.t = 0; camTween.dur = dur; camTween.onDone = onDone;
  camTween.active = true;
  controls.enabled = false;
}
function updateCamTween(dt) {
  camTween.t = Math.min(1, camTween.t + dt / camTween.dur);
  const k = easeInOutCubic(camTween.t);
  camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
  controls.target.lerpVectors(camTween.fromTgt, camTween.toTgt, k);
  camera.lookAt(controls.target);
  if (camTween.t >= 1) {
    camTween.active = false;
    controls.enabled = true;
    if (camTween.onDone) { const cb = camTween.onDone; camTween.onDone = null; cb(); }
  }
}

scene.add(new THREE.HemisphereLight(0xffffff, 0xc3cede, 0.34));
const dir1 = new THREE.DirectionalLight(0xffffff, 0.95); dir1.position.set(7, 14, 9); scene.add(dir1);
/* 主光投影：让机器在地面留下柔和落地影（物体不再像浮着） */
dir1.castShadow = true;
dir1.shadow.mapSize.set(1024, 1024);
Object.assign(dir1.shadow.camera, { left: -11, right: 11, top: 13, bottom: -3, near: 2, far: 42 });
dir1.shadow.bias = -0.0005; dir1.shadow.normalBias = 0.02;
const dir2 = new THREE.DirectionalLight(0xdfe8ff, 0.2); dir2.position.set(-9, 7, -7); scene.add(dir2);


/* 演播室地面：浅灰高光地台 + 机型圈位标线 */
const floorCv = document.createElement('canvas'); floorCv.width = floorCv.height = 512;
{
  const c = floorCv.getContext('2d');
  const rg = c.createRadialGradient(256, 256, 30, 256, 256, 256);
  rg.addColorStop(0, '#a3acb8'); rg.addColorStop(0.45, '#7c8593'); rg.addColorStop(1, '#525a66');
  c.fillStyle = rg; c.fillRect(0, 0, 512, 512);
  /* 场地边缘（靠墙一圈）额外压暗：让地面渐变到接近墙脚亮度，消灭墙/地硬交界 */
  const edge = c.createRadialGradient(256, 256, 150, 256, 256, 256);
  edge.addColorStop(0, 'rgba(26,38,54,0)'); edge.addColorStop(0.55, 'rgba(26,38,54,0.28)'); edge.addColorStop(1, 'rgba(26,38,54,0.62)');
  c.fillStyle = edge; c.fillRect(0, 0, 512, 512);
}
const floorTex = new THREE.CanvasTexture(floorCv); floorTex.colorSpace = THREE.SRGBColorSpace;
/* 地面：不做实时镜面反射（省掉每帧整场景重渲的倒影），用渐变地台贴图 + 轻清漆光泽，
   仅借静态 envMap 反射出一点高级感；落地软影由 receiveShadow 提供，机器不再像浮着 */
const plat = new THREE.Mesh(
  new THREE.CircleGeometry(30, 96),
  new THREE.MeshPhysicalMaterial({
    map: floorTex, roughness: 0.35, metalness: 0.0, clearcoat: 0.7, clearcoatRoughness: 0.3,
    envMapIntensity: 0.5
  })
);
plat.rotation.x = -Math.PI / 2; plat.position.y = 0.002; plat.receiveShadow = true; scene.add(plat);
const platSide = new THREE.Mesh(
  new THREE.CylinderGeometry(30, 30, 0.5, 96, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x98a2b1, roughness: 0.65, metalness: 0.15, side: THREE.DoubleSide })
);
platSide.position.y = -0.25; scene.add(platSide);

/* 接地软阴影（贴地椭圆，主光投影之外的接触暗部） */
const blobCv = document.createElement('canvas'); blobCv.width = blobCv.height = 128;
{
  const c = blobCv.getContext('2d');
  const rg = c.createRadialGradient(64, 64, 4, 64, 64, 64);
  rg.addColorStop(0, 'rgba(20,32,52,0.55)'); rg.addColorStop(0.55, 'rgba(20,32,52,0.22)'); rg.addColorStop(1, 'rgba(20,32,52,0)');
  c.fillStyle = rg; c.fillRect(0, 0, 128, 128);
}
const blobTex = new THREE.CanvasTexture(blobCv);
function contactShadow(px, pz, r) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 1.5),
    new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.9 }));
  m.rotation.x = -Math.PI / 2; m.position.set(px, 0.008, pz); scene.add(m);
}
contactShadow(-3.8, 0, 1.5);
contactShadow(3.8, 0, 1.5);
function floorRing(rIn, rOut, px, pz, color) {
  const m = new THREE.Mesh(new THREE.RingGeometry(rIn, rOut, 96),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 }));
  m.rotation.x = -Math.PI / 2; m.position.set(px, 0.012, pz); scene.add(m);
}
floorRing(2.02, 2.14, -3.8, 0, 0xb7c1d2);   /* 红机圈位 */
floorRing(2.02, 2.14,  3.8, 0, 0xb7c1d2);   /* 蓝机圈位 */
floorRing(3.55, 3.64, 0, 0, 0xc3ccd9);      /* 台中共用大圆 */

/* 演播室背景墙：浅蓝弧形大屏（渐变 + 「福彩开奖」立体字）+ 飘浮泡泡/红蓝装饰球 */
{
  /* 画布宽高比 = 墙面弧长/高 = 26*4/15 ≈ 6.93，否则字会被横向拉宽铺满整面墙 */
  const cv = document.createElement('canvas'); cv.width = 4160; cv.height = 600;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#3a5a80'); g.addColorStop(0.55, '#5e84ab'); g.addColorStop(1, '#9fb6cf');
  c.fillStyle = g; c.fillRect(0, 0, 4160, 600);
  /* 墙脚与顶部压暗：墙面不再是「一张平贴的纸」，有上下渐深的环境遮挡 */
  const aoB = c.createLinearGradient(0, 600, 0, 400);
  aoB.addColorStop(0, 'rgba(28,44,68,0.42)'); aoB.addColorStop(1, 'rgba(28,44,68,0)');
  c.fillStyle = aoB; c.fillRect(0, 380, 4160, 220);
  const aoT = c.createLinearGradient(0, 0, 0, 170);
  aoT.addColorStop(0, 'rgba(24,40,64,0.34)'); aoT.addColorStop(1, 'rgba(24,40,64,0)');
  c.fillStyle = aoT; c.fillRect(0, 0, 4160, 170);
  /* 标题后一团椭圆亮部，模拟大屏中心的打光（收紧，别糊成一片白） */
  const glow = c.createRadialGradient(2080, 118, 40, 2080, 118, 460);
  glow.addColorStop(0, 'rgba(255,255,255,0.42)');
  glow.addColorStop(0.5, 'rgba(255,255,255,0.16)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = glow; c.fillRect(0, 0, 4160, 600);
  /* 「福彩开奖」立体字：暗蓝厚度层 → 白描边 → 蓝渐变面（字缩小上移，不压机器） */
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = 'bold 110px "Microsoft YaHei", Arial';
  c.fillStyle = '#2a5f96';
  c.fillText('福彩开奖', 2089, 112);                    /* 厚度/投影层 */
  c.lineWidth = 12; c.strokeStyle = '#ffffff';
  c.strokeText('福彩开奖', 2080, 106);                  /* 白描边 */
  const tg = c.createLinearGradient(0, 56, 0, 160);
  tg.addColorStop(0, '#5db1e8'); tg.addColorStop(0.5, '#2f7fd0'); tg.addColorStop(1, '#6db6ec');
  c.fillStyle = tg;
  c.fillText('福彩开奖', 2080, 106);                    /* 蓝渐变主面 */
  const wallTex = new THREE.CanvasTexture(cv); wallTex.colorSpace = THREE.SRGBColorSpace;
  /* 弧面用 BackSide 从内看会镜像 → 水平翻转 UV 把字正过来 */
  wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.x = -1;
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(26, 26, 15, 96, 1, true, Math.PI - 2.0, 4.0),
    new THREE.MeshBasicMaterial({ map: wallTex, side: THREE.BackSide, fog: false })
  );
  wall.position.y = 5.5; scene.add(wall);

  /* ---- 墙脚处理：真实演播室不会让墙直接插进地面 ----
     ① 深色踢脚带（半径略小，压住墙面与地面的接缝）
     ② 圆弧倒角（Lathe 扫出的 1/4 圆环，把 90° 硬角变成圆角）
     ③ 灯槽亮线（墙脚的一条暖白灯带，是电视演播厅的标准做法） */
  const skirtMat = new THREE.MeshStandardMaterial({ color: 0x36465c, roughness: 0.72, metalness: 0.1, side: THREE.BackSide });
  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(25.92, 25.92, 0.62, 96, 1, true, Math.PI - 2.0, 4.0), skirtMat);
  skirt.position.y = 0.31; scene.add(skirt);

  const filletPts = [];
  for (let i = 0; i <= 8; i++) {
    const a = (i / 8) * Math.PI * 0.5;                    /* 0 → 90° */
    filletPts.push(new THREE.Vector2(25.45 + 0.47 * Math.cos(a), 0.47 * Math.sin(a)));
  }
  const fillet = new THREE.Mesh(
    new THREE.LatheGeometry(filletPts, 96),
    new THREE.MeshStandardMaterial({ color: 0x8e99a8, roughness: 0.35, metalness: 0.1, side: THREE.DoubleSide })
  );
  fillet.position.y = 0.0; scene.add(fillet);

  /* 灯槽：贴墙脚一圈暖白亮线 + 一条更宽更淡的晕 */
  const coveMat = new THREE.MeshBasicMaterial({ color: 0xfff3e0, fog: false });
  const cove = new THREE.Mesh(new THREE.CylinderGeometry(25.82, 25.82, 0.07, 96, 1, true, Math.PI - 2.0, 4.0), coveMat);
  cove.position.y = 0.66; scene.add(cove);
  const coveGlowMat = new THREE.MeshBasicMaterial({ color: 0xfff3e0, transparent: true, opacity: 0.22, fog: false, side: THREE.DoubleSide, depthWrite: false });
  const coveGlow = new THREE.Mesh(new THREE.CylinderGeometry(25.80, 25.80, 0.30, 96, 1, true, Math.PI - 2.0, 4.0), coveGlowMat);
  coveGlow.position.y = 0.55; scene.add(coveGlow);

  /* 飘浮泡泡（白色半透明）+ 左红右蓝两个装饰大球（对照直播厅背景） */
  const bubbleMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.20, roughness: 0.06, clearcoat: 1, depthWrite: false });
  const accentRed = new THREE.MeshPhysicalMaterial({ color: 0xd0342c, transparent: true, opacity: 0.6, roughness: 0.15, clearcoat: 1, depthWrite: false });
  const accentBlue = new THREE.MeshPhysicalMaterial({ color: 0x2743d0, transparent: true, opacity: 0.6, roughness: 0.15, clearcoat: 1, depthWrite: false });
  const spots = [
    [-9.5, 6.8, -14, 0.9, bubbleMat], [-6.2, 9.2, -16, 0.5, bubbleMat], [-12.4, 4.4, -13, 0.45, bubbleMat],

/* 贴图：4 个白圆片 + 黑色号码（真机球为哑光磨砂质感） */
function makeBallMesh(num, color) {
  const s = String(num);                                 /* 转字符串：下方要用 includes 判定 6/9 */
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 512, 256);
  const grad = ctx.createRadialGradient(160, 70, 20, 256, 128, 280);
  grad.addColorStop(0, 'rgba(255,255,255,.30)'); grad.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
  /* 球面 6 个白圈数字：上下两条纬带各 3 个、经度交错 60°，分布均匀且远离极点
     （极点附近 equirect 畸变最严重 → 避开后文字不再被拉变形）。
     每个白圈在画布上横向加宽 1/cos(lat) 补偿经度收敛，球面上仍是正圆；
     数字本身按 1/cos(lat) 横向拉伸绘制，球面展开后比例还原、不变形。 */
  const drawNumPatch = (lat, lon) => {
    const cl = Math.max(Math.cos(lat), 0.6);
    const ry = 46, rx = ry / cl;
    const py = (0.5 - lat / Math.PI) * 256;
    const px = ((lon / (Math.PI * 2)) % 1) * 512;
    for (const ox of [0, -512, 512]) {                     /* 横跨接缝补画 */
      const cx = px + ox;
      if (cx + rx < 0 || cx - rx > 512) continue;
      const disc = ctx.createRadialGradient(cx - 12, py - 10, 4, cx, py, rx);
      disc.addColorStop(0, '#ffffff'); disc.addColorStop(0.85, '#f4f4f4'); disc.addColorStop(1, '#dcdcdc');
      ctx.fillStyle = disc;
      ctx.beginPath(); ctx.ellipse(cx, py, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.stroke();
      ctx.save();
      ctx.translate(cx, py);
      ctx.scale(1 / cl, 1);                                /* 横向拉伸补偿经度收敛 → 球面不变形 */
      ctx.fillStyle = '#151515';
      ctx.font = 'bold 52px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(s, 0, 4);
      /* 6/9 区分：6 下方加横线、9 上方加横线（标准防旋转歧义记法） */
      if (s.includes('6') || s.includes('9')) {
        ctx.strokeStyle = '#151515'; ctx.lineWidth = 6; ctx.lineCap = 'round';
        const bw = 32;
        ctx.beginPath();
        if (s.includes('6')) { ctx.moveTo(-bw, 30); ctx.lineTo(bw, 30); }   /* 6 → 下划线 */
        else { ctx.moveTo(-bw, -28); ctx.lineTo(bw, -28); }                  /* 9 → 上划线 */
        ctx.stroke();
      }
      ctx.restore();
    }
  };
  const LAT = 33 * Math.PI / 180;
  for (let b = 0; b < 2; b++) {
    const lat = b === 0 ? LAT : -LAT;
    for (let k = 0; k < 3; k++) drawNumPatch(lat, (b * 60 + k * 120) * Math.PI / 180);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.Mesh(
    new THREE.SphereGeometry(R_BALL, 24, 24),
    new THREE.MeshPhysicalMaterial({
      map: tex, roughness: 0.42, metalness: 0.0, envMapIntensity: 0.45,
      clearcoat: 0.6, clearcoatRoughness: 0.25
    })
  );
}

/* ================= 构建真机结构（全部世界坐标，杜绝装配错位） ================= */
function buildMachine(cfg) {
  const { cx, cz, R, cy } = cfg;
  const cosExit = Math.cos(cfg.exitHalf);
  const sphBottom = cy - R;

  /* ---- ④ 底座（对照真机近景）：整段【柱身】从脚环一直通到球壳托盘底，
          滑道、出球机构都在柱身外的滑道上走，不藏在这段里；
          球壳坐在托盘上，柱身颜色从不接触球壳。柱身/矮座半径 = 搅拌轮盘外半径 rOuter ---- */
  /* 底座配色按机型（红机红座 / 蓝机蓝座），材质参数与原来一致，只换 color */
  const baseMat = new THREE.MeshPhysicalMaterial({
    color: cfg.baseColor, roughness: 0.3, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.18, envMapIntensity: 0.9 });
  const baseDeepMat = new THREE.MeshPhysicalMaterial({
    color: cfg.baseDeepColor, roughness: 0.38, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.2, envMapIntensity: 0.8 });
  const footRing = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.12, 48), baseDeepMat);
  footRing.position.set(cx, 0.06, cz); footRing.castShadow = true; scene.add(footRing);
  const baseBody = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.50, 48), baseMat);
  baseBody.position.set(cx, 0.12 + 0.25, cz); baseBody.castShadow = true; scene.add(baseBody);   /* 矮座：顶面 y=0.62 */
  /* 柱身：从矮座顶(0.62)一直通到球壳托盘底(2.39)，与矮座连成整根柱（0.62 起点与矮座顶齐平，不留缝） */
  const bodyTube = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 1.77, 48, 1, true), baseMat);
  bodyTube.position.set(cx, 0.62 + 0.885, cz); bodyTube.castShadow = true; scene.add(bodyTube); /* 0.62 → 2.39 */
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(0.56, 0.56, 0.06, 48), acrylicMat);
  tray.position.set(cx, 2.39, cz); tray.renderOrder = 5; scene.add(tray);   /* 托盘顶面 y=2.42：球壳直筒坐上面 */
  const logo = new THREE.Mesh(new THREE.CircleGeometry(0.20, 40),
    new THREE.MeshStandardMaterial({ map: makeLogoTexture(), transparent: true, roughness: 0.45, metalness: 0 }));
  logo.position.set(cx, 1.20, cz + 0.533);   /* 蓝柱竖直中段（柱身 0→2.39 的中部） */
  logo.rotation.x = -0.02; scene.add(logo);

  /* ---- ② 球状搅拌室：旋转体轮廓 = 上部完整球面 + 下部竖直圆柱筒（对照真机：
          球壳下半段是直筒壁、垂直落到托盘上，不是喇叭/锥形收口），
          下前方出球孔在壳面上真开一个圆洞（alphaMap 挖洞，球就是从这个洞里掉出来的） ---- */
  const shellPts = [];
  const skirtR = cfg.rOuter;                            /* 直筒半径 = 搅拌轮盘外半径(0.53)，转轮外缘贴筒壁 */
  const skirtStartY = -Math.sqrt(R * R - skirtR * skirtR); /* 球面→直筒切点 y≈-1.054R */
  const thCut = Math.acos(skirtStartY / R);             /* 球顶→切点的天顶角（≈153°） */
  for (let i = 0; i <= 40; i++) {
    const th = (i / 40) * thCut;
    shellPts.push(new THREE.Vector2(Math.sin(th) * R, Math.cos(th) * R));
  }
  const skirtBottomY = 2.42 - cy;                       /* 直筒垂直坐进托盘顶面(2.42)，球底与蓝座间留透明柜身段 */
  shellPts.push(new THREE.Vector2(skirtR, skirtBottomY));
  const mainGeo = new THREE.LatheGeometry(shellPts, 48);
  /* 出球孔在壳面上真开洞：Lathe 的 v=0 在球顶、u=0 在 +Z 方向接缝（孔心就在 +Z，
     洞跨接缝 → 左右各画半圆拼成整洞）。
     关键：alphaTest 比较的是「opacity × alphaMap」后的最终 alpha，玻璃 opacity=0.09，
     阈值必须 < 0.09 —— 之前阈值写 0.45 导致整壳被丢弃（壳直接消失）。 */
  {
    const thHole = Math.acos(cfg.exitDir.y);            /* 孔心天顶角 */
    const phHalf = Math.asin(Math.sin(cfg.exitHalf) / Math.sin(thHole));
    const vC = (thHole / thCut) * 40 / 41, dV = (cfg.exitHalf / thCut) * 40 / 41;
    const acv = document.createElement('canvas'); acv.width = 1024; acv.height = 1024;
    const actx = acv.getContext('2d');
    actx.fillStyle = '#fff'; actx.fillRect(0, 0, 1024, 1024);
    actx.fillStyle = '#000';
    const cyPx = (1 - vC) * 1024, ryPx = dV * 1024, rxEy = phHalf / (Math.PI * 2) * 1024;
    for (const hx of [0, 1024]) {          /* flipY 默认 true：canvas 顶行 → v=1（球顶） */
      actx.beginPath();
      actx.ellipse(hx, cyPx, rxEy, ryPx, 0, 0, Math.PI * 2);
      actx.fill();
    }
    const shellMat = glassMat.clone();
    shellMat.alphaMap = new THREE.CanvasTexture(acv);
    shellMat.alphaTest = 0.03;
    shellMat.needsUpdate = true;
    var main = new THREE.Mesh(mainGeo, shellMat);
  }
  main.position.set(cx, cy, cz); main.renderOrder = 6; scene.add(main);
  /* 壳内补光：电视上球壳内部打光，球堆有高光闪烁感 */
  const shellLight = new THREE.PointLight(0xfff2dc, 1.5, 3.5, 2);
  shellLight.position.set(cx, cy - 0.15, cz + 0.35); scene.add(shellLight);
  /* 赤道接缝（两个半球的可开合处，装饰） */
  const seam = new THREE.Mesh(new THREE.TorusGeometry(R, 0.018, 8, 64), blueDeep);
  seam.rotation.x = Math.PI / 2; seam.position.set(cx, cy, cz); scene.add(seam);

  /* 出球口：球壳下前方一个简单圆形出口——壳面真开洞（alphaMap），不加白圈、
     不加挡板：玻璃本身近乎全透明，任何贴在孔口的圈/板看起来都是悬浮的异物。
     球从壳上这个圆孔直接落下 */
  const exR = R * Math.sin(cfg.exitHalf);
  /* 挡板（翻板）已去掉——出球口就是壳面上一个简单的圆孔，白圈只是孔沿切边。
     valvePivot 仅供动画代码引用，保留空组防止引用报错 */
  const valvePivot = new THREE.Group();

  /* ---- 搅拌室底部（对照真机渲染图）：大托盘 + 托盘上的小型双转子 + 鼓形托壳藏电机。
          球坐在托盘上；内盘/外环带尺寸很小（Ø0.40 / Ø0.90，球径 Ø2.36），
          反向不同速，凸起为半球拨凸；除电机/转轴外全透明有机玻璃 ---- */
  const discSpins = [];
  const rotorY = cfg.discY;
  const brightMetal = new THREE.MeshStandardMaterial({ color: 0xdde4f5, metalness: 0.9, roughness: 0.28, envMapIntensity: 1.2 });
  /* 静态支撑盘（转轮下面的托板，出球孔处开孔）+ 转轮外围的静止托环（球堆外圈坐上面） */
  {
    const supShape = new THREE.Shape(); supShape.absarc(0, 0, 0.49, 0, Math.PI * 2);
    const supGeo = new THREE.ExtrudeGeometry(supShape, { depth: 0.04, bevelEnabled: false, curveSegments: 48 });
    supGeo.rotateX(-Math.PI / 2);
    const sup = new THREE.Mesh(supGeo, acrylicMat);
    sup.position.set(cx, rotorY - 0.045, cz); sup.renderOrder = 6; scene.add(sup);
    /* 托盘顶面(转子下方0.005)与转轮/内盘顶面错开 —— 三者原共面于 rotorY+0.05，
       旋转面与静止面共面产生随转动闪烁的 Z-fighting 锯齿（用户截图红框） */
  }
  /* 鼓形托壳 + 藏在里面的电机与转轴（参考图：外面只看到透明鼓身） */
  {
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.14, 32, 1, true), acrylicMat);
    drum.position.set(cx, rotorY - 0.07, cz); drum.renderOrder = 6; scene.add(drum);
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.09, 24), brightMetal);
    motor.position.set(cx, rotorY - 0.05, cz); scene.add(motor);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.06, 10), brightMetal);
    shaft.position.set(cx, rotorY - 0.03, cz); scene.add(shaft);
  }
  /* 内盘（r ≤ rHub，3 个半球拨凸） */
  const inner = new THREE.Group();
  inner.position.set(cx, rotorY, cz); scene.add(inner);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rHub, cfg.rHub, 0.05, 32), acrylicMat);
  hub.position.y = 0.025; hub.renderOrder = 6; inner.add(hub);
  /* 拨块：内圈 2 小块（真机同款） */
  const wedgeIn = new THREE.CylinderGeometry(0.035, 0.060, 0.060, 4, 1);
  wedgeIn.rotateY(Math.PI / 4);
  for (let k = 0; k < 2; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 2 * Math.PI * 2 + 0.4;
    const blk = new THREE.Mesh(wedgeIn, acrylicMat);
    blk.position.set(cfg.rHub * 0.62, 0.06, 0); blk.renderOrder = 6;
    hold.add(blk); inner.add(hold);
  }
  discSpins.push(inner);
  /* 外环带（gapInner → rOuter，外缘紧贴球壁 —— 真机形态，周围不多一圈）。
     盘面连续无孔：出球孔开在转轮上方侧壁，球被环带带动贴壁转到孔口即落出 */
  const outer = new THREE.Group();
  outer.position.set(cx, rotorY, cz); scene.add(outer);
  const ringShape = new THREE.Shape(); ringShape.absarc(0, 0, cfg.rOuter, 0, Math.PI * 2);
  const ringHole = new THREE.Path(); ringHole.absarc(0, 0, cfg.gapInner, 0, Math.PI * 2);
  ringShape.holes.push(ringHole);
  const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: 0.05, bevelEnabled: false, curveSegments: 48 });
  ringGeo.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, acrylicMat);
  ring.renderOrder = 6; outer.add(ring);
  /* 外圈 4 大块（真机同款），贴外缘骑贴壁球堆 */
  const wedgeOut = new THREE.CylinderGeometry(0.045, 0.070, 0.070, 4, 1);
  wedgeOut.rotateY(Math.PI / 4);
  for (let k = 0; k < 4; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 4 * Math.PI * 2;
    const blk = new THREE.Mesh(wedgeOut, acrylicMat);
    blk.position.set(cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.93, 0.07, 0); blk.renderOrder = 6;
    hold.add(blk); outer.add(hold);
  }
  /* 盘面凸圈（真机同款挡圈）：球聚在圈上被拨块打；随外盘转动（圆环体对称，视觉不动） */
  const bead = new THREE.Mesh(new THREE.TorusGeometry(cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.55, 0.035, 12, 64), acrylicMat);
  bead.rotation.x = Math.PI / 2; bead.position.y = 0.05; bead.renderOrder = 6; outer.add(bead);
  discSpins.push(outer);

  /* ---- ① 号码球预览架（对照参考图）：等长透明管沿一条弧排成单排（冠形），
          插在球壳正后方，管身微外倾，管底削尖伸入球壳内部；摇奖前球全在管内。
          中段一块透明托板水平穿过管身固定（参考图中的固定板），无任何圆环 ---- */
  const rackDefs = [];
  {
    const N = cfg.rackN, rt = cfg.rackRR * R, L = cfg.rackLen;
    const per = Math.floor(cfg.count / N), rem = cfg.count % N;
    const step = (R_BALL * 2 + 0.005) / rt;          /* 相邻管相切：弧距 = 管径，紧密排列 */
    let byMin = 1e9;
    for (let i = 0; i < N; i++) {
      const a = (i - (N - 1) / 2) * step;            /* 0 = 正后方，全部竖直 */
      const bx = cx + Math.sin(a) * rt;
      const bz = cz - Math.cos(a) * rt;
      const ddx = Math.hypot(bx - cx, bz - cz);
      const by = cy + Math.sqrt(Math.max(0.15, R * R - ddx * ddx)) - cfg.rackInset;
      const n = i < rem ? per + 1 : per;
      if (by < byMin) byMin = by;
      rackDefs.push({ base: new THREE.Vector3(bx, by, bz), dir: new THREE.Vector3(0, 1, 0), n });
      /* 管身：等长竖直、顶部齐平，底部长斜切一刀（参考图：细长椭圆斜切口，前缘低后缘高） */
      const cutH = cfg.tubeR * 2.4;                    /* 斜切面高度差（拉长切口） */
      const tubeGeo = new THREE.CylinderGeometry(cfg.tubeR, cfg.tubeR, L, 20, 1, true);
      {
        const pos = tubeGeo.attributes.position;
        for (let vi = 0; vi < pos.count; vi++) {
          if (pos.getY(vi) < 0) pos.setY(vi, -L / 2 + cutH / 2 * (pos.getZ(vi) / cfg.tubeR));
        }
        tubeGeo.computeVertexNormals();
      }
      const tube = new THREE.Mesh(tubeGeo, acrylicMat);
      tube.position.set(bx, by + L / 2, bz);
      tube.renderOrder = 7; scene.add(tube);
      /* 斜切椭圆封口面 */
      const capGeo = new THREE.CircleGeometry(cfg.tubeR, 24);
      capGeo.rotateX(-Math.PI / 2);
      capGeo.scale(1, 1, cutH / 2 / cfg.tubeR);
      const cap = new THREE.Mesh(capGeo, acrylicMat);
      cap.position.set(bx, by, bz);
      cap.rotation.x = -Math.atan(cutH / 2 / cfg.tubeR);
      cap.renderOrder = 7; scene.add(cap);
    }
    /* 顶部盖板（参考图）：扇形环板随管排弧度弯曲（圆心=球心，径向带包住管圈），
       每个管位开圆洞、管从洞中穿过 */
    {
      const aH = (N - 1) / 2 * step + 0.09;          /* 板半张角（管排外只留窄边） */
      const cShape = new THREE.Shape();
      cShape.absarc(0, 0, rt + 0.17, Math.PI / 2 - aH, Math.PI / 2 + aH, false);
      cShape.absarc(0, 0, rt - 0.17, Math.PI / 2 + aH, Math.PI / 2 - aH, true);
      cShape.closePath();
      for (let i = 0; i < N; i++) {
        const a = (i - (N - 1) / 2) * step;
        const hole = new THREE.Path();
        hole.absarc(Math.sin(a) * rt, Math.cos(a) * rt, cfg.tubeR + 0.02, 0, Math.PI * 2, true);
        cShape.holes.push(hole);
      }
      const cGeo = new THREE.ExtrudeGeometry(cShape, { depth: 0.035, bevelEnabled: false, curveSegments: 48 });
      cGeo.rotateX(-Math.PI / 2);                    /* 竖直成型 → 水平放倒，板顶朝 +Y */
      const cover = new THREE.Mesh(cGeo, acrylicMat);
      cover.position.set(cx, byMin + L - 0.005, cz); /* 板底略低于管口，管穿进洞里 */
      cover.renderOrder = 7; scene.add(cover);
    }
    /* 闸门挡板：水平托板贴在管底斜切口下方，摇奖前托住整排管里的球，
       开始摇奖时向后抽开松球 */
    const gateY = byMin + 0.098;                     /* 托板顶面贴球底（球底 = byMin + 0.12） */
    const gateZ = cz - rt * 0.66;
    const chord = 2 * rt * Math.sin((N - 1) / 2 * step) + 0.35;
    const plate = new THREE.Mesh(new THREE.BoxGeometry(chord, 0.045, 0.8), acrylicMat);
    plate.position.set(cx, gateY, gateZ);
    plate.renderOrder = 7; scene.add(plate);
    var gatePlate = plate, gateBaseZ = gateZ;
  }

  /* ---- ③ 出球滑道：几何 100% 取自物理段表 RAIL_SEGS（同一份数据，不存在第二套）----
     竖直接引段 = 圆管（与物理圆管膛同半径）；其余 = U 形滑槽（平底+双壁，
     截面常量 RAIL_W / RAIL_FLOOR / RAIL_WALLTOP 与物理 railWallCollide 同源） */
  {
    const _Y = new THREE.Vector3(0, 1, 0);
    const _X = new THREE.Vector3(1, 0, 0);
    const slot = Math.acos(RAIL_OPEN_COS);
    /* U 形槽一体成型：底板+两侧低壁（+闭端帽）是一根连续挤出的实体，
       没有任何拼接缝——旧方案底/壁/端板三块透明盒互相重叠，透射光叠出凌乱的亮缝 */
    const W2 = RAIL_W + 0.011, T = 0.022;
    const uProfile = new THREE.Shape();
    uProfile.moveTo(-W2, -RAIL_FLOOR - 0.025);
    uProfile.lineTo(W2, -RAIL_FLOOR - 0.025);
    uProfile.lineTo(W2, RAIL_WALLTOP);
    uProfile.lineTo(W2 - T, RAIL_WALLTOP);
    uProfile.lineTo(W2 - T, -RAIL_FLOOR);
    uProfile.lineTo(-W2 + T, -RAIL_FLOOR);
    uProfile.lineTo(-W2 + T, RAIL_WALLTOP);
    uProfile.lineTo(-W2, RAIL_WALLTOP);
    uProfile.closePath();
    function uSlotGeo(len, capA, capB) {
      const geo = new THREE.ExtrudeGeometry(uProfile, { depth: len, bevelEnabled: false, steps: 1 });
      const pos = geo.attributes.position, nor = geo.attributes.normal;
      const P = [], N = [];
      for (let i = 0; i < pos.count; i += 3) {
        const z0 = pos.getZ(i), z1 = pos.getZ(i + 1), z2 = pos.getZ(i + 2);
        const atA = Math.abs(z0) < 1e-5 && Math.abs(z1) < 1e-5 && Math.abs(z2) < 1e-5;
        const atB = Math.abs(z0 - len) < 1e-5 && Math.abs(z1 - len) < 1e-5 && Math.abs(z2 - len) < 1e-5;
        if ((atA && !capA) || (atB && !capB)) continue;   /* 开口端不封帽 */
        for (let k = 0; k < 3; k++) {
          P.push(pos.getX(i + k), pos.getY(i + k), pos.getZ(i + k));
          N.push(nor.getX(i + k), nor.getY(i + k), nor.getZ(i + k));
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
      return g;
    }
    let prevH = null;   /* 上一段的水平走向 = 球进洞的来向（限位挡圈朝它留口） */
    /* 同一条滑槽的共线段合并成一根整体挤出体（每条滑槽各自一体成型，中间零接缝） */
    let rail = null;    /* {A, dir, len, capA, capB, end} */
    function flushRail() {
      if (!rail) return;
      const mesh = new THREE.Mesh(uSlotGeo(rail.len, rail.capA, rail.capB), railMat);
      mesh.position.copy(rail.A);
      mesh.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(rail.up, rail.dir), rail.up, rail.dir));
      mesh.renderOrder = 7; scene.add(mesh);
      /* 闭端挡墙：物理端板是整圆盘（能挡住整颗球），槽体闭端帽却只有低侧壁高
         （球心在帽顶上方）——「看得见球停住、看不见挡的结构」就是这里。
         闭端外侧面贴一块与槽体同宽的挡墙，从槽底一直到轴线上方 4cm（过球心），
         与端面齐平贴合，物理=视觉。 */
      const hG = -0.03, y0 = -RAIL_FLOOR - 0.025; /* 顶边=球心高度：盖过球心即可；宽度收到两侧壁之间，不撑大槽体外廓 */
      const side = new THREE.Vector3().crossVectors(rail.up, rail.dir);
      const basis = new THREE.Matrix4().makeBasis(side, rail.up, rail.dir);
      for (const [closed, P, sgn] of [[rail.capA, rail.A, -1], [rail.capB, rail.end, 1]]) {
        if (!closed) continue;
        const g = new THREE.Mesh(new THREE.BoxGeometry(2 * (W2 - T), hG - y0, T * 0.75), railMat);
        g.position.copy(P).addScaledVector(rail.up, (hG + y0) / 2)
          .addScaledVector(rail.dir, sgn * (T / 2 + 0.001));
        g.quaternion.setFromRotationMatrix(basis);
        g.renderOrder = 7; scene.add(g);
      }
      rail = null;
    }
    for (const [a, c, openA, openB] of RAIL_SEGS) {
      const A = new THREE.Vector3(cx + a[0], a[1], cz + a[2]);
      const B = new THREE.Vector3(cx + c[0], c[1], cz + c[2]);
      const dir = B.clone().sub(A); const len = dir.length(); dir.normalize();
      const vertical = Math.abs(dir.y) > 0.7;
      /* 槽体局部基：X=沿轴，Y=世界上方在⊥平面内的投影，Z=水平侧向 */
      const up = _Y.clone().addScaledVector(dir, -dir.y);
      if (up.lengthSq() < 1e-6) up.set(0, 0, 1); else up.normalize();
      const side = dir.clone().cross(up).normalize();
      const mid = A.clone().addScaledVector(dir, len / 2);
      const q = new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(dir, up, side));

      if (vertical) {
        /* 层间落球洞 = 滑槽的「一体出料口」：底板到洞口为止（洞就是槽底消失的那一段），
           两侧壁 + 远端限位墙延续同一截面外廓、与槽体端面严格对接（零重叠、
           不另立圆管和挡圈），底部敞开 —— 球滚出底板边缘就顺着洞掉到下层，
           远端墙高出球心 = 限位，球冲不出去。 */
        flushRail();
        if (prevH) {
          const W2c = RAIL_W + 0.011, Tc = 0.022, Lc = 0.07;
          const cs = new THREE.Shape();
          cs.moveTo(0, -W2c); cs.lineTo(Lc, -W2c); cs.lineTo(Lc, W2c); cs.lineTo(0, W2c);
          cs.lineTo(0, W2c - Tc); cs.lineTo(Lc - Tc, W2c - Tc); cs.lineTo(Lc - Tc, -W2c + Tc);
          cs.lineTo(0, -W2c + Tc); cs.closePath();
          const mesh = new THREE.Mesh(
            new THREE.ExtrudeGeometry(cs, { depth: 0.16, bevelEnabled: false }), railMat);
          mesh.position.copy(A);
          mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(
            new THREE.Vector3(prevH.x, 0, prevH.z),
            new THREE.Vector3(-prevH.z, 0, prevH.x),
            new THREE.Vector3(0, -1, 0)));
          mesh.renderOrder = 7; scene.add(mesh);
        }
      } else {
        /* 共线续接：下一段从上一根的末端、同方向继续 → 并入同一根整体挤出体 */
        const colinear = rail
          && rail.end.distanceTo(A) < 1e-4
          && rail.dir.dot(dir) > 0.999;
        if (colinear) {
          rail.len += len; rail.capB = !openB; rail.end = B.clone();
        } else {
          flushRail();
          rail = { A: A.clone(), dir: dir.clone(), up: up.clone(), len, capA: !openA, capB: !openB, end: B.clone() };
        }
      }
      if (!vertical) { prevH = new THREE.Vector3(dir.x, 0, dir.z); if (prevH.lengthSq() > 1e-8) prevH.normalize(); }
    }
    flushRail();
    /* 左端挡块 = 最后一段的闭端端板（上面已画），不再单独放一块外漂的板 */
  /* 支撑柱已去掉（用户反馈三根竖杆突兀）：滑槽直接固定在透明柜身上，不再加竖杆 */
  }

  const glow = new THREE.PointLight(0xffffff, 0.38, R * 3.5);
  glow.position.set(cx, cy, cz); scene.add(glow);

  /* ---- 球：初始停在预览架竖管内（管内可叠多颗） ---- */
  const m = {
    ...cfg, discSpins, valvePivot, rackDefs, gatePlate, gateZ0: gateBaseZ,
    balls: [], agit: 0, agitTarget: 0,
    loadOpen: false, holeOpen: false,
    cosExit, exitDirW: cfg.exitDir.clone(),
    exitW: new THREE.Vector3(cx, cy, cz).addScaledVector(cfg.exitDir, R),
    phase: 'idle', timer: 0, drawsLeft: cfg.key === 'red' ? 6 : 1,
    capturedBall: null, doneCount: 0,
    /* 拨块：真实物理件（与视觉梯形块同尺寸同转速），碰撞实际拨动小球 */
    pegList: [
      { r: cfg.rHub * 0.62, rp: 0.055, w: cfg.wInner, rot: 0, n: 2, ph: 0.4 },
      { r: cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.93, rp: 0.065, w: cfg.wOuter, rot: 1, n: 4, ph: 0 },
    ],
    rotPhase: [0, 0],
  };
  /* 编号随机洗牌（Fisher–Yates）：出球由物理选位置，编号↔位置每局随机，
     否则顺序摆放会让确定性物理每局都开出相近的号 */
  const nums = Array.from({ length: cfg.count }, (_, i) => i + 1);
  for (let i = nums.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
  let idx = 0;
  for (const td of rackDefs) {
    for (let k = 0; k < td.n; k++) {
      if (idx >= nums.length) break;
      const num = nums[idx++];
      const mesh = makeBallMesh(num, ballColor(num, cfg.key));
      const sT = R_BALL + 0.12 + k * (R_BALL * 2 + 0.01);
      const home = td.base.clone().addScaledVector(td.dir, sT);
      const b = { num, p: home.clone(), home, tube: td, sT, vsT: 0,
        v: new THREE.Vector3(), mesh, state: 'rack', placed: false, m };
      m.balls.push(b);
      mesh.position.copy(home);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      scene.add(mesh);
    }
  }
  machines.push(m);
  return m;
}
MACH_CFG.forEach(buildMachine);

window.camera = camera; window.controls = controls;
window.scene = scene; window.THREE = THREE;       /* 调试钩子：场景图/几何诊断 */

window.RAIL_W = RAIL_W; window.RAIL_FLOOR = RAIL_FLOOR; window.RAIL_WALLTOP = RAIL_WALLTOP;

for (let i = 0; i < 7; i++) {

/* ================= 物理 ================= */
const _rel = new THREE.Vector3(), _n = new THREE.Vector3(), _t = new THREE.Vector3(), _dir = new THREE.Vector3();

function stepInBall(b, m, dt) {
  const v = b.v, p = b.p;

  /* 预览管内：沿管轴一维下滑，到达管底削尖端即脱离进球壳 */
  if (b.tube) {
    b.vsT += -G * b.tube.dir.y * dt;
    b.vsT *= (1 - 0.25 * dt);
    b.sT += b.vsT * dt;
    if (b.sT <= R_BALL + 0.08) b.tube = null;      /* 滑出管底口 */
    else {
      b.p.copy(b.tube.base).addScaledVector(b.tube.dir, b.sT);
      v.copy(b.tube.dir).multiplyScalar(b.vsT);
      return;
    }
  }

  v.y -= G * dt;

  if (m.agit > 0.01) {
    /* 同轴双转子（专利 US6145836）：中心盘/外环盘反向不同速，切向拖带 + 拨杆弹跳 */
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rr = Math.hypot(dx, dz);
    /* 盘面摩擦拖带（球接触转盘被摩擦带动，物理等效）；主要搅拌动力来自拨块碰撞 */
    if (Math.abs(p.y - m.discY) < 0.30) {
      const w = rr < (m.rHub + m.gapInner) / 2 ? m.wInner : (rr < m.rOuter ? m.wOuter : 0);
      if (w !== 0) {
        const sp = w * m.agit * Math.min(rr, m.rOuter) * 0.42;
        v.x += -dz / (rr + 1e-4) * sp * dt;
        v.z += dx / (rr + 1e-4) * sp * dt;
      }
    }
  }

  if (m.holeOpen) {
    /* 出球口导流：把球堆引向洞口（其余球仍在搅拌） */
    _dir.subVectors(m.exitW, p);
    const dd = _dir.length();
    if (dd < m.R * 1.8) {
      v.addScaledVector(_dir.normalize(), 70 * (1 - dd / (m.R * 1.8)) * dt);
    }
  }

  const damp = m.agit > 0.01 ? 0.4 : 0.15;
  v.multiplyScalar(Math.max(0, 1 - damp * dt));
  const spd = v.length();
  if (spd > 5) v.multiplyScalar(5 / spd);        /* 限速防穿透 */
  p.addScaledVector(v, dt);

  /* 转子顶面支撑：支撑范围=盘面高度球壳内可达的最大水平半径（贴壁），球不会漏也不会悬空 */
  const floorC = m.discY + 0.05 + R_BALL;
  const prr = Math.hypot(p.x - m.cx, p.z - m.cz);
  const maxR = Math.min(Math.sqrt(Math.max(0, (m.R - R_BALL) ** 2 - (m.cy - floorC) ** 2)), m.rOuter);
  if (p.y < floorC) {
    p.y = floorC;
    if (prr > maxR) {
      const k = maxR / prr;
      p.x = m.cx + (p.x - m.cx) * k;
      p.z = m.cz + (p.z - m.cz) * k;
    }
    if (v.y < -2.2) v.y *= -0.25; else v.y = 0;
  }

  /* 落球收拢：管束跨在开口上，球直落；仅对落到开口边缘外侧的球施加向心力 */
  if (m.loadOpen && p.y > m.cy + 0.4) {
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rho = Math.hypot(dx, dz);
    const maxRho = m.R * Math.sin(m.inletHalf) - R_BALL - 0.04;
    if (rho > maxRho && rho > 0.05) {
      v.x -= dx / rho * 30 * dt;
      v.z -= dz / rho * 30 * dt;
    }
  }

  /* 搅拌室玻璃约束：顶部入球口 / 下前方出球口可穿 */
  _rel.subVectors(p, _t.set(m.cx, m.cy, m.cz));
  const d = _rel.length();
  /* 出球捕获：独立于玻璃约束 —— 开阀窗口内球到达孔口锥区并越过捕获深度（转轮前缘）即入滑道 */
  if (m.holeOpen && !m.capturedBall && d > 1e-6) {
    _n.copy(_rel).divideScalar(d);
    if (_n.dot(m.exitDirW) > m.cosExit && d > m.R - R_BALL * 1.6) {
      b.state = 'rail'; b.placed = false; b.settle = 0; b.railT = 0;
      b.p.copy(m.exitW);
      b.v.copy(m.exitDirW).multiplyScalar(0.8);
      m.capturedBall = b;
      m.holeOpen = false;               /* 真机档杆动作：出一颗立即关阀 */
      /* 已出的球留在滑道里排队（摇完后实体球排成一行 = 开奖结果） */
      return;
    }
  }
  if (d > m.R - R_BALL) {
    _n.copy(_rel).divideScalar(d);
    const inExit = m.holeOpen && _n.dot(m.exitDirW) > m.cosExit;
    if (!inExit) {
      p.copy(_t).addScaledVector(_n, m.R - R_BALL);
      const vn = v.dot(_n);
      if (vn > 0) {
        v.addScaledVector(_n, -(1 + REST_WALL) * vn);
        v.multiplyScalar(0.985);
      }
    }
  }
}

/* 出球滑道碰撞：与视觉共用 RAIL_SEGS / RAIL_R / RAIL_OPEN_COS（定义在几何参数区）。
   球保留完整自由度，槽壁 = 圆柱内壁约束；槽口区（法向朝上超过 RAIL_OPEN_COS）不设壁，
   与视觉上开的那条槽口完全对应。 */
const _sv = new THREE.Vector3();
function railWallCollide(b, m, dt) {
  let prevH = null;   /* 上一段的水平走向 = 球进洞的来向 */
  for (const [a, c, openA, openB] of RAIL_SEGS) {
    const ax = m.cx + a[0], ay = a[1], az = m.cz + a[2];
    const dx = m.cx + c[0] - ax, dy = c[1] - ay, dz = m.cz + c[2] - az;
    const L = Math.hypot(dx, dy, dz), L2 = L * L;
    const ux = dx / L, uy = dy / L, uz = dz / L;
    const rawT = ((b.p.x - ax) * dx + (b.p.y - ay) * dy + (b.p.z - az) * dz) / L2;
    const wT = rawT * L;   /* 沿轴世界距离（rawT 是 0~1 参数，别和世界长度混用） */
    /* rel = 球心到轴线（未截断投影）的垂线向量 */
    const relx = b.p.x - (ax + dx * rawT), rely = b.p.y - (ay + dy * rawT), relz = b.p.z - (az + dz * rawT);
    const d = Math.hypot(relx, rely, relz);
    if (Math.abs(uy) > 0.7) {
      /* ---- 孔口限位边：孔口背侧一段矮挡圈（与视觉那段圆弧同一条约束）。
              球冲过孔心、横向还在孔口范围内时被挡回孔口，顺着洞掉下去，不会从孔沿溜过去 ---- */
      if (prevH && wT > -0.02 && wT < 0.07) {
        const along = relx * prevH.x + relz * prevH.z;         /* 沿来球方向的水平偏移 */
        const latd = Math.abs(-relx * prevH.z + relz * prevH.x);
        const lim = RAIL_R - R_BALL;                            /* 球心最远到孔壁前一个球径 */
        if (along > lim && latd < RAIL_R * 0.95) {
          b.p.x += (lim - along) * prevH.x;
          b.p.z += (lim - along) * prevH.z;
          const vh = b.v.x * prevH.x + b.v.z * prevH.z;
          if (vh > 0) { b.v.x -= 1.05 * vh * prevH.x; b.v.z -= 1.05 * vh * prevH.z; }
        }
      }
      /* ---- 竖直孔/管段：圆管膛，球心约束在轴 3.5cm 内自由下落（仅段内，无限圆柱会把球钉在半空）。
              洞顶前 4cm 是「喇叭口」：球从上层斜着冲进洞口时，球心还在洞外，不能被孔壁顶回去 ---- */
      if (wT > R_BALL * 0.45 && wT < L + 0.02 && d < RAIL_R && d > 1e-6) {
        const touching = d > RAIL_WALL_GAP - 0.002;
        if (touching) {
          if (d > RAIL_WALL_GAP) {
            _sv.set(relx / d, rely / d, relz / d);
            b.p.set(ax + dx * rawT + _sv.x * RAIL_WALL_GAP, ay + dy * rawT + _sv.y * RAIL_WALL_GAP, az + dz * rawT + _sv.z * RAIL_WALL_GAP);
            const vn = b.v.dot(_sv);
            if (vn > 0) b.v.addScaledVector(_sv, -(1 + 0.05) * vn);
          }
          const vd = b.v.x * ux + b.v.y * uy + b.v.z * uz;
          const cx2 = b.v.x - ux * vd, cy2 = b.v.y - uy * vd, cz2 = b.v.z - uz * vd;
          const kC = 1 - 0.25, kR = 1 - 0.08 * dt;
          b.v.set(ux * vd * kR + cx2 * kC, uy * vd * kR + cy2 * kC, uz * vd * kR + cz2 * kC);
        }
      }
    } else {
      /* ---- U 形滑槽段：底面 + 双层低侧壁（截面常量与视觉同源）。
         约束只在球贴近本段截面时生效：段内 rawT、球还没完全越过壁顶(rely<WALLTOP+R_BALL)、
         槽底以下一个球径内 rely>-(FLOOR+R+0.05)（否则下轨的球会被上轨底面吸走）、
         横向 |lat|<W+0.06（贴着槽口外侧的也接住） ---- */
      const sx = -uz, sz = ux;
      const lat = relx * sx + relz * sz;
      /* 约束窗口 = 槽体真实范围（仅 5mm 接缝余量）。底面和侧壁必须同一个窗口：
         只要侧壁伸出洞口，球掉到下轨后就会被上轨侧壁横向锁住、速度每帧清零。
         接缝处上段 L 与下段 0 是同一点，两段都有 5mm 余量，不会出现空档。 */
      /* rely 下限只到「贴底穿透一个球半径」：下面那一层的球（落差 0.17）不能被本层槽底吸上来 */
      const floorMin0 = R_BALL - RAIL_FLOOR;
      if (wT > -0.005 && wT < L + 0.005
        && rely < RAIL_WALLTOP + R_BALL && rely > floorMin0 - R_BALL
        && lat > -(RAIL_W + 0.06) && lat < RAIL_W + 0.06) {
        let hit = false;
        const floorMin = floorMin0;                      /* 球心最低 = 槽底 + 球半径 */
        /* 底面支撑只存在于真实槽段（视觉槽底画到哪里，底就到哪里）；
           段端 ±0.06 的接球延伸窗口只保留侧壁/端板，不给底 —— 球滚出落球洞即自由掉落 */
        const inFloor = wT > -0.005 && wT < L + 0.005;
        if (inFloor && rely < floorMin) {
          b.p.y += floorMin - rely;
          /* 槽底法向（⊥轴线、竖直平面内）：只去掉法向速度分量（e=0），
             不吃轴向滚动分量 —— 旧写法 v.y*=-0.05 会把沿坡速度一起清掉，球滚不动 */
          const nl = Math.hypot(ux * uy, 1 - uy * uy, uz * uy) || 1;
          const nx0 = -ux * uy / nl, ny0 = (1 - uy * uy) / nl, nz0 = -uz * uy / nl;
          const vnn = b.v.x * nx0 + b.v.y * ny0 + b.v.z * nz0;
          if (vnn < 0) { b.v.x -= vnn * nx0; b.v.y -= vnn * ny0; b.v.z -= vnn * nz0; }
          hit = true;
        }
        /* 低侧壁的真实约束：球心高出壁顶 hAbove 后，球在壁顶高度处的水平截面半径缩到
           sqrt(R²-h²)，球腰仍比这个半宽更宽就被壁挡住；球整体越过壁顶才真正自由。
           壁顶齐球心时 hAbove=0 → 限位回到 RAIL_W-R_BALL（与原通高壁完全一致）。 */
        const hAbove = Math.max(0, rely - RAIL_WALLTOP);
        const rCut = Math.sqrt(Math.max(0, R_BALL * R_BALL - hAbove * hAbove));
        const wallMax = Math.max(0.004, RAIL_W - rCut);  /* 球心横向限位 */
        const sx = -uz, sz = ux;                          /* 水平侧向（⊥轴线） */
        const lat = relx * sx + relz * sz;
        if (lat > wallMax) {
          const corr = lat - wallMax;
          b.p.x -= sx * corr; b.p.z -= sz * corr;
          const vn = b.v.x * sx + b.v.z * sz;
          if (vn > 0) { b.v.x -= 1.05 * vn * sx; b.v.z -= 1.05 * vn * sz; }
          hit = true;
        } else if (lat < -wallMax) {
          const corr = -wallMax - lat;
          b.p.x += sx * corr; b.p.z += sz * corr;
          const vn = b.v.x * sx + b.v.z * sz;
          if (vn < 0) { b.v.x -= 1.05 * vn * sx; b.v.z -= 1.05 * vn * sz; }
          hit = true;
        }
        if (hit) {
          /* 滚动接触：环向（绕轴打转）快速衰减；轴向滚动阻力很小（kR 0.03/s），
             缓坡（4°）也能滚完全程 */
          const vd = b.v.x * ux + b.v.y * uy + b.v.z * uz;
          const cx2 = b.v.x - ux * vd, cy2 = b.v.y - uy * vd, cz2 = b.v.z - uz * vd;
          const kC = 1 - 0.25, kR = 1 - 0.03 * dt;
          b.v.set(ux * vd * kR + cx2 * kC, uy * vd * kR + cy2 * kC, uz * vd * kR + cz2 * kC);
        }
      }
    }
    /* 端板：双侧挡板，独立于管膛判定 —— 球从端头外面撞上（如上轨末端洞掉落错过膛口）
       也会被接回管内，杜绝球跌出滑道后无限下坠消失 */
    for (const end of [openA ? null : [ax, ay, az, -ux, -uy, -uz], openB ? null : [ax + dx, ay + dy, az + dz, ux, uy, uz]]) {
      if (!end) continue;
      const pen = (b.p.x - end[0]) * end[3] + (b.p.y - end[1]) * end[4] + (b.p.z - end[2]) * end[5];
      const distEnd = Math.hypot(b.p.x - end[0], b.p.y - end[1], b.p.z - end[2]);
      /* 只在槽内高度挡（rely<0 = 可见挡墙顶）：球从上方落进接球口时径直穿过，
         不被端板捕捉区搬运/耗速；落进槽里之后端板才是一堵真墙 */
      const atSlot = rely < -0.03;
      const inside = atSlot && pen > -R_BALL && pen < 0 && distEnd < RAIL_R + 0.02;
      const outside = atSlot && pen >= 0 && pen < R_BALL + 0.06 && distEnd < 0.35;
      if (inside || outside) {
        if (outside) {   /* 从外面撞板：放回板内侧一个球半径处 */
          b.p.x = end[0] - end[3] * R_BALL; b.p.y = end[1] - end[4] * R_BALL; b.p.z = end[2] - end[5] * R_BALL;
        } else {
          const corr = -R_BALL - pen;
          b.p.x += end[3] * corr; b.p.y += end[4] * corr; b.p.z += end[5] * corr;
        }
        const vn = b.v.x * end[3] + b.v.y * end[4] + b.v.z * end[5];
        if (vn > 0) { b.v.x -= (1 + 0.15) * vn * end[3]; b.v.y -= (1 + 0.15) * vn * end[4]; b.v.z -= (1 + 0.15) * vn * end[5]; }
      }
    }
    if (Math.abs(uy) <= 0.7) {
      const hx = dx, hz = dz, hl = Math.hypot(hx, hz) || 1;
      prevH = { x: hx / hl, z: hz / hl };
    }
  }
}
/* 滑道球：全 3D 弹道 + 管壁/端板约束。出孔后停顿=落地碰撞自然耗散（无脚本计时）；
   入位=球在下轨自行停稳（显示事件，非物理干预） */
function stepRailBall(b, m, dt) {
  b.railT = (b.railT || 0) + dt;
  b.v.y -= G * dt;
  b.p.addScaledVector(b.v, dt);
  railWallCollide(b, m, dt);
  /* 兜底防丢球：滑道球若意外跌出管膛（双层端板之外的最后防线），重新放回下轨右段空白区
     （避开取球位队列，球自然滚向队尾入位） */
  if (b.p.y < LOWER_PTS[0][1] - 0.45 || (!b.placed && b.railT > 12)) {
    const a = LOWER_PTS[0], c = LOWER_PTS[1];
    const ax = m.cx + a[0], ay = a[1], az = m.cz + a[2];
    const dx = m.cx + c[0] - ax, dy = c[1] - ay, dz = m.cz + c[2] - az;
    let t = 0.43;   /* 下轨右段 x≈0.70：紧挨队尾右侧，落回槽内让球继续滚向队列 */
    b.p.set(ax + dx * t, ay + dy * t, az + dz * t);
    b.v.set(0, 0, 0); b.settle = 0; b.railT = 0;
  }
  if (!b.placed) {
    const sp = b.v.length();
    const inLow = b.p.y < LOWER_PTS[0][1] + 0.06 && Math.abs(b.p.x - m.cx) < 1.35;
    /* 入位 = 球滚进排队区（落球洞正下方不算 —— 否则球停在那堵住洞口，下一颗压在头顶卡死） */
    const inQueue = b.p.x - m.cx < LOWER_PTS[0][0] - 0.2;
    if (inLow && inQueue && sp < 0.25) {
      b.settle += dt;                                  /* 基本停稳 → 累计入位计时 */
    } else if (inLow && inQueue) {
      b.settle = Math.max(0, b.settle - dt * 0.4);     /* 末球被旁边球轻挤：只缓慢衰减，不清零，避免久等 */
    } else {
      b.settle = 0;
    }
    /* 入位 = 落稳 0.4s（或排队区堵满 6s）：比原 1.2s/速度0.12 宽松得多，仍要求真滚进队列停稳 */
    if (b.settle > 0.4 || b.railT > 6) { b.placed = true; onBallPlaced(b, m); }
  }
}

/* 预览管内排队：同管球保持间距，只向上推 */
function collideTubes(m) {
  const byTube = new Map();
  for (const b of m.balls) {
    if (!b.tube) continue;
    if (!byTube.has(b.tube)) byTube.set(b.tube, []);
    byTube.get(b.tube).push(b);
  }
  const minD = R_BALL * 2 + 0.005;
  for (const arr of byTube.values()) {
    arr.sort((a, c) => a.sT - c.sT);
    for (let i = 0; i < arr.length - 1; i++) {
      const lo = arr[i], up = arr[i + 1];
      if (up.sT < lo.sT + minD) up.sT = lo.sT + minD;
    }
  }
}

/* 球-球碰撞（同组） */
function collideGroup(arr) {
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      _rel.subVectors(b.p, a.p);
      const d = _rel.length(), min = R_BALL * 2;
      if (d > 1e-6 && d < min) {
        _n.copy(_rel).divideScalar(d);
        const overlap = min - d;
        a.p.addScaledVector(_n, -overlap * 0.5);
        b.p.addScaledVector(_n, overlap * 0.5);
        const rv = _dir.subVectors(b.v, a.v).dot(_n);
        if (rv < 0) {
          const imp = -(1 + REST_BALL) * rv * 0.5;
          a.v.addScaledVector(_n, -imp);
          b.v.addScaledVector(_n, imp);
        }
      }
    }
  }
}

/* ================= 流程控制（真机顺序，PLC 按固定搅拌间隔出球） ================= */
const state = { running: false, currentIdx: 0 };
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');

function startShow() {
  if (state.running) return;
  state.running = true;
  state.currentIdx = 0;
  startBtn.disabled = true; resetBtn.disabled = true;
  focusCamera('red');                 /* 镜头先推到左侧(红)机器 */
  beginMachine(machines[0]);
}
function beginMachine(m) {
  m.phase = 'loading'; m.timer = 0; m.doneHandled = false;
  m.physicsActive = true; m.restCount = 0;
  setPhase(m.key === 'red' ? '预览架挡板开启 · 号码球落入搅拌室' : '蓝球机：预览架挡板开启 · 落球', true);
}
function onBallPlaced(b, m) {
  const totalIdx = m.key === 'red' ? m.doneCount : 6;
  const el = slotEls[totalIdx];
  if (el) { el.textContent = b.num; el.classList.add('filled', 'pop'); }
  m.doneCount++;
}

function updateMachine(m, dt) {
  m.timer += dt;
  if (m.phase === 'loading') {
    /* 抽出闸门挡板：向后（-Z）抽开 0.5s，然后松球 */
    if (m.gatePlate) m.gatePlate.position.z = m.gateZ0 - Math.min(1, m.timer / 0.5) * 0.85;
    if (m.timer > 0.8 && !m.loadOpen) {
      m.loadOpen = true;                     /* 挡板已抽开：管内球沿管滑落进球壳 */
      for (const b of m.balls) { b.state = 'in'; b.vsT = 0; b.v.set(0, 0, 0); }
    }
    /* 球全部脱离预览管并落稳（宽阈值 + 超时兜底，避免死锁） */
    if (m.loadOpen && (m.balls.every(b => !b.tube && b.p.y < m.cy + m.R * 0.45) || m.timer > 8)) {
      m.loadOpen = false;
      m.phase = 'stir'; m.timer = 0; m.agitTarget = 1;
      setPhase('搅拌底盘双向旋转 · 充分搅拌中', true);
    }
  } else if (m.phase === 'stir') {
    if (m.timer > 3) {
      m.phase = 'draw'; m.timer = 0; m.stallT = 0; m.holeOpen = true;
      setPhase('出球口档杆开启 · 等待出球', true);
    }
  } else if (m.phase === 'draw') {
    /* 纯物理出球：开阀后拨块持续搅拌，球堆自然流动到孔口即捕获。
       稳定性兜底：开阀 12s 仍无球到孔口（极端堆叠）时来一记强抖动震松球堆
       （等效真机的振动落料），保证出球必然推进 */
    if (m.holeOpen) {
      m.stallT = (m.stallT || 0) + dt;
      if (m.stallT > 12) {
        m.stallT = 0;
        for (const b of m.balls) {
          if (b.state === 'in' && !b.tube) {
            b.v.y += 2.2 + Math.random() * 1.2;
            b.v.x += (Math.random() - 0.5) * 1.6;
            b.v.z += (Math.random() - 0.5) * 1.6;
          }
        }
      }
    }
    if (m.capturedBall && m.capturedBall.placed) {
      m.capturedBall = null;
      m.drawsLeft--;
      if (m.drawsLeft > 0) {
        m.phase = 'stir'; m.timer = 0;
        setPhase('其余球持续搅拌 · 准备下一球', true);
      } else {
        m.phase = 'done'; m.agitTarget = 0.12;
      }
    }
  } else if (m.phase === 'done') {
    /* 终态只处理一次：否则两台都 done 后每帧重复触发 focusCamera，把回位补间卡死 */
    if (!m.doneHandled) {
      m.doneHandled = true;
      if (state.currentIdx < machines.length - 1) {
        state.currentIdx++;
        const idx = state.currentIdx;                       /* 记录待切机位，超时后校验，防重置误触发 */
        /* 先让红机终态画面停留 2 秒，看清最后一个球，再切到右侧(蓝)机器并开始出球 */
        setTimeout(() => {
          if (state.running && state.currentIdx === idx) {
            beginMachine(machines[idx]);
            focusCamera('blue');
          }
        }, 2000);
      } else if (machines.every(mm => mm.phase === 'done')) {
        state.running = false;
        startBtn.disabled = true; resetBtn.disabled = false;
        setPhase('本期开奖完成', false);
        /* 蓝机终态画面先停留 2 秒（看清楚最后一个蓝球），再回到全景 */
        setTimeout(() => { focusCamera('overview'); }, 2000);
      }
    }
  }

  m.agit += (m.agitTarget - m.agit) * Math.min(1, dt * 2);
  /* 视觉盘相位直接取物理相位 —— 拨块视觉与拨块碰撞严格同帧 */
  m.discSpins[0].rotation.y = m.rotPhase[0];
  m.discSpins[1].rotation.y = m.rotPhase[1];
  m.valvePivot.rotation.x = -(m.holeOpen ? 1 : 0) * 1.5;

  /* 球物理：按真实时间累积子步（固定步长 1/120），保证任何帧率下速度一致。
     done 终态仍跑物理，让在飞/悬空的球自然落稳（避免「最后一球到位即全体定格」的诡异感）；
     全部静止超过 0.4s 后由下方逻辑停止物理，不会无限空转 */
  if (m.physicsActive && m.phase !== 'idle') {
  m.acc = (m.acc || 0) + dt;
  let sub = 0;
  while (m.acc >= DT && sub < 8) {
    const inBalls = [], railBalls = [];
    for (const b of m.balls) {
      if (b.state === 'in') { stepInBall(b, m, DT); inBalls.push(b); }
      else if (b.state === 'rail') { stepRailBall(b, m, DT); railBalls.push(b); }
    }
    collideGroup(inBalls);
    collideTubes(m);
    collideGroup(railBalls);                       /* 滑道球 3D 球球碰撞（管壁约束对齐成队） */
    /* 旋转拨块：真实物理件，逐块碰撞把球实际拨动（混合的动力来源） */
    if (m.agit > 0.01) {
      m.rotPhase[0] += m.wInner * m.agit * DT;
      m.rotPhase[1] += m.wOuter * m.agit * DT;
      for (const b of inBalls) {
        if (Math.abs(b.p.y - m.discY - 0.09) > 0.14) continue;
        for (const pg of m.pegList) {
          for (let k = 0; k < pg.n; k++) {
            const th = m.rotPhase[pg.rot] + pg.ph + k / pg.n * Math.PI * 2;
            const px = m.cx + Math.cos(th) * pg.r, pz = m.cz - Math.sin(th) * pg.r;
            const dx = b.p.x - px, dz = b.p.z - pz;
            const dd = Math.hypot(dx, dz), minD = R_BALL + pg.rp;
            if (dd < minD && dd > 1e-6) {
              const nx = dx / dd, nz = dz / dd;
              b.p.x = px + nx * minD; b.p.z = pz + nz * minD;
              /* 拨块表面速度（绕 y 转，视觉 rotation.y=th → 世界 (cos,-sin)） */
              const svx = -pg.w * m.agit * pg.r * Math.sin(th);
              const svz = -pg.w * m.agit * pg.r * Math.cos(th);
              const rvx = b.v.x - svx, rvz = b.v.z - svz;
              const vn = rvx * nx + rvz * nz;
              if (vn < 0) { b.v.x -= vn * nx * 1.05; b.v.z -= vn * nz * 1.05; }
              b.v.x += (svx - b.v.x) * 0.45; b.v.z += (svz - b.v.z) * 0.45;
              /* 撞击点在球心下方：正面撞击把球向前上方挑起，产生真实翻滚 */
              if (vn < -0.5) b.v.y += Math.min(-vn, 2.0) * 0.15;
            }
          }
        }
      }
    }
    /* 盘面凸圈（真机同款挡圈）：低挡环随外盘刚体转动（全速摩擦，比拖带 0.55 快 →
       持续犁过球层），球被拨块推压或堆挤撞圈时被垫起翻越/弹回 —— 打断贴盘公转层 */
    if (m.agit > 0.01) {
      const rc = 0.035, ringR = m.gapInner + (m.rOuter - m.gapInner) * 0.55;
      const topY = m.discY + 0.05, sv = m.wOuter * m.agit * ringR;
      for (const b of inBalls) {
        const bx = b.p.x - m.cx, bz = b.p.z - m.cz;
        const br = Math.hypot(bx, bz);
        if (br < 1e-4 || Math.abs(b.p.y - topY) > 0.4) continue;
        const dr = br - ringR, dy = b.p.y - topY;
        const dd = Math.hypot(dr, dy), minD = R_BALL + rc;
        if (dd < minD && dd > 1e-6) {
          const nr = dr / dd, ny = dy / dd, push = minD - dd;
          const ux = bx / br, uz = bz / br;
          b.p.x += ux * push * nr; b.p.z += uz * push * nr; b.p.y += push * ny;
          /* 法向低弹性缓冲 */
          const nvx = ux * nr, nvy = ny, nvz = uz * nr;
          const vn = b.v.x * nvx + b.v.y * nvy + b.v.z * nvz;
          if (vn < 0) { b.v.x -= vn * nvx * 1.3; b.v.y -= vn * nvy * 1.3; b.v.z -= vn * nvz * 1.3; }
          /* 切向：圈面刚体转速（无打滑），把贴圈球带到全速 */
          const tx = -uz, tz = ux;
          const dv = sv - (b.v.x * tx + b.v.z * tz);
          b.v.x += tx * dv * 0.5; b.v.z += tz * dv * 0.5;
        }
      }
    }
    /* 护城河清扫：碰撞把球挤到轮缘外的话，收回转轮支撑圈（球始终落在转轮上） */
    {
      const fl = m.discY + 0.05 + R_BALL;
      const mR = Math.min(Math.sqrt(Math.max(0, (m.R - R_BALL) ** 2 - (m.cy - fl) ** 2)), m.rOuter);
      for (const b of inBalls) {
        if (b.p.y < fl) {
          const bx = b.p.x - m.cx, bz = b.p.z - m.cz, br = Math.hypot(bx, bz);
          if (br > mR) {
            const k = mR / br;
            b.p.x = m.cx + bx * k; b.p.z = m.cz + bz * k;
          }
        }
      }
    }
    m.acc -= DT; sub++;
  }
  }  /* end: 球物理 */
  if (m.acc > DT * 8) m.acc = 0;   /* 卡顿后丢弃积压，避免爆炸 */

  /* 终态落稳判定：done 后所有在飞球自然落位、整体静止超过 0.4s 即停物理，避免无限空转 */
  if (m.phase === 'done' && m.physicsActive) {
    let moving = false;
    for (const b of m.balls) {
      if (b.state === 'in' || b.state === 'rail') {
        if (b.v.length() > 0.05) { moving = true; break; }
      }
    }
    m.restCount = moving ? 0 : (m.restCount || 0) + dt;
    if (m.restCount > 0.4) m.physicsActive = false;
  }

  /* mesh 同步 + 滚动旋转（球面多数字，入位后保持原姿态即可，无需摆正） */
  for (const b of m.balls) {
    if (b.state === 'rack') continue;
    if (!b.placed) {
      const sp = Math.hypot(b.v.x, b.v.z);
      if (sp > 0.05) {
        b.mesh.rotation.x -= b.v.z / R_BALL * DT * 0.9;
        b.mesh.rotation.z += b.v.x / R_BALL * DT * 0.9;
      }
    }
    b.mesh.position.copy(b.p);
  }
}

/* ================= 重置 ================= */
function resetAll() {
  for (const m of machines) {
    m.phase = 'idle'; m.agit = 0; m.agitTarget = 0;
    m.physicsActive = false; m.restCount = 0;
    m.loadOpen = false; m.holeOpen = false;
    m.capturedBall = null; m.doneCount = 0; m.timer = 0;
    m.valvePivot.rotation.x = 0;
    if (m.gatePlate) m.gatePlate.position.z = m.gateZ0;
    m.drawsLeft = m.key === 'red' ? 6 : 1;
    for (const b of m.balls) {
      b.p.copy(b.home);
      b.v.set(0, 0, 0);
      b.state = 'rack'; b.placed = false; b.railT = 0; b.settle = 0;
      b.sT = b.home ? R_BALL + 0.12 : 0;
      b.tube = null;
      /* 重新挂回各自的预览管（按 home 找归属管） */
      for (const td of m.rackDefs) {
        const rel = _dir.subVectors(b.home, td.base);
        if (Math.abs(rel.dot(td.dir) - (R_BALL + 0.12)) < R_BALL && Math.hypot(rel.x - td.dir.x * rel.dot(td.dir), rel.z - td.dir.z * rel.dot(td.dir)) < 0.05) {
          b.tube = td;
          b.sT = rel.dot(td.dir);
          break;
        }
      }
      b.vsT = 0;
      b.mesh.visible = true; b.mesh.scale.setScalar(1);
      b.mesh.position.copy(b.p);
      b.mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
    }
  }
  for (const el of slotEls) { el.textContent = ''; el.classList.remove('filled', 'pop'); }
  state.running = false;
  startBtn.disabled = false; resetBtn.disabled = true;
  setPhase('点击「开始摇奖」', false);
  focusCamera('overview');            /* 重置时镜头也回到全景 */
}
resetBtn.disabled = true;
startBtn.addEventListener('click', startShow);
resetBtn.addEventListener('click', resetAll);

/* ================= 主循环 ================= */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.running || machines.some(m => m.phase !== 'idle')) {
    for (const m of machines) {
      if (m.phase !== 'idle') updateMachine(m, dt);
    }
  }
  if (camTween.active) updateCamTween(dt); else controls.update();
  composer.render();
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
