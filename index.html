<script type="module">

rim.rotation.x = Math.PI / 2; rim.position.y = 0.02; scene.add(rim);

/* 星空背景 */
{

/* ================= 物理常量 =================
   比例对齐真机：1 单位 ≈ 0.296m（底座 0.77m = 2.6 单位）
   搅拌室 Ø0.70m → R=1.18；球径按 ryo 官方图实测 球/球壳=1:13.2（Ø0.053m 真机球） */
const R_BALL = 0.089;
const G = 22;
const REST_BALL = 0.55;
const REST_WALL = 0.62;
const DT = 1 / 120;

const machines = [];
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb9c3e2, metalness: 1, roughness: 0.2, envMapIntensity: 1.3 });
const blueBase = new THREE.MeshPhysicalMaterial({ color: 0x2743d0, roughness: 0.3, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.18, envMapIntensity: 0.9 });
const blueDeep = new THREE.MeshPhysicalMaterial({ color: 0x1c2f9e, roughness: 0.38, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.2, envMapIntensity: 0.8 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaccff, metalness: 0, roughness: 0.05,
  transparent: true, opacity: 0.09, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 0.85
});
const acrylicMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfd8ff, metalness: 0, roughness: 0.08,
  transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.85
});

/* ============ 真机几何参数（DESIGN.md 定案） ============
   底座 = 深蓝直筒圆柱 Ø0.75m（比球壳宽一圈），正面红色双色球 LOGO，顶面透明亚克力平台。
   整个台座上的装置（球壳/预览管/搅拌盘/出球机构/滑道）= 全透明有机玻璃，无彩色件。
   预览架 = 多根竖直透明管插入球壳顶部（摇奖前球全在管内下段，球壳是空的）。
   出球口 = 球壳底部偏前小孔（单球通过）；滑道 = 上横管向右 → 右端下行 → 下横槽向左 → 取球位。 */
const UPPER_PTS = [  /* 上层滑道（相对 cx,cz）：出球孔正下方 → 右端，微下坡向右；末端=洞 */
  [0.00, 2.90, 0.70], [0.60, 2.88, 0.70], [1.18, 2.86, 0.70],
];
const LOWER_PTS = [  /* 下层滑道：右端接球口（上轨末端洞正下偏右） → 左行下坡 → 取球位 */
  [1.45, 2.76, 0.70], [0.00, 2.72, 0.52], [-1.10, 2.69, 0.52],
];
const INTRO_PTS = [  /* 出球孔 → 上层滑道口的接引短槽 */
  [0.00, 3.29, 0.68], [0.00, 2.90, 0.70],
];
/* ============ 真机几何参数（DESIGN.md 定案） ============
   底座 = 深蓝直筒圆柱 Ø0.75m（比球壳宽一圈），正面红色双色球 LOGO，顶面透明亚克力平台。
   整个台座上的装置（球壳/预览管/搅拌盘/出球机构/滑道）= 全透明有机玻璃，无彩色件。
   预览架 = 等长透明管沿圆环排列（对照参考图），插入球壳后半部，管底削尖，摇奖前球全在管内。
   出球口 = 球壳下前方小孔（单球通过）；滑道 = 出球孔下 → 右行 → 下行 → 左行 → 取球位。 */
const MACH_CFG = [
  {
    key: 'red', cx: -3.8, cz: 0, count: 33, color: '#d0342c', label: '1 号机 · 红球区',
    R: 1.18, cy: 4.26,
    inletHalf: 50 * Math.PI / 180,
    exitHalf: 12 * Math.PI / 180,            /* 底部小孔：孔径≈1.5×球径，只允许一球通过 */
    exitDir: new THREE.Vector3(0, -0.826, 0.564).normalize(),  /* 出球孔开在转轮上方的球壳侧壁 */
    /* 搅拌器（专利 + 真机渲染图）：两个转轮外缘紧贴球壁，周围不多一圈；内盘 3 个半球凸起 /
       外环带 6 个，反向不同速；转轮下面支撑盘，支撑盘下鼓形托壳里藏电机 */
    discY: 3.22, rHub: 0.22, gapInner: 0.25, rOuter: 0.53, wInner: 9.0, wOuter: -6.0,
    /* 预览架：等长竖管紧密排成一排（沿球面弧），插在球壳正后方，管底削尖 */
    rackN: 12, rackRR: 0.95, rackLen: 1.5, rackInset: 0.30,
    tubeR: 0.105
  },
  {
    key: 'blue', cx: 3.8, cz: 0, count: 16, color: '#1e63c8', label: '2 号机 · 蓝球区',
    R: 1.18, cy: 4.26,
    inletHalf: 50 * Math.PI / 180,
    exitHalf: 12 * Math.PI / 180,
    exitDir: new THREE.Vector3(0, -0.826, 0.564).normalize(),
    discY: 3.22, rHub: 0.22, gapInner: 0.25, rOuter: 0.53, wInner: 9.0, wOuter: -6.0,
    rackN: 12, rackRR: 0.95, rackLen: 1.5, rackInset: 0.30,
    tubeR: 0.105
  },
];

/* ================= 号码球：按号码范围四色分区（蓝/绿/橙/紫，参考真机球箱图） ================= */
function ballColor(num, key) {
  if (key === 'blue') return '#1e63c8';        /* 蓝球区保持双色球标志蓝 */
  if (num <= 9)  return '#3fa3d8';             /* 浅蓝 */
  if (num <= 18) return '#4caf50';             /* 绿 */
  if (num <= 26) return '#f09a37';             /* 橙 */
  return '#8e5cb8';                            /* 紫 */
}

/* 贴图：4 个白圆片 + 黑色号码（真机球为哑光磨砂质感） */
function makeBallMesh(num, color) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 512, 256);
  const grad = ctx.createRadialGradient(160, 70, 20, 256, 128, 280);
  grad.addColorStop(0, 'rgba(255,255,255,.30)'); grad.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
  /* 球面 10 个白圈数字：斐波那契球面布点（按球面积均匀分布）——
     任意朝向都有数字正对视线，且间距处处相等；
     近极区白圈横向加宽补偿 equirect 畸变（球面上看仍是等大正圆） */
  const GA = Math.PI * (3 - Math.sqrt(5));
  for (let k = 0; k < 10; k++) {
    const lat = Math.asin(1 - 2 * (k + 0.5) / 10);        /* 纬度按球面积均匀 */
    const lon = k * GA;                                    /* 经度黄金角交错 */
    const py = (0.5 - lat / Math.PI) * 256;
    const rx = 39 / Math.max(Math.cos(lat), 0.45), ry = 39;
    const px = ((lon / (Math.PI * 2)) % 1) * 512;
    for (const ox of [0, -512, 512]) {                     /* 横跨接缝补画 */
      const cx = px + ox;
      if (cx + rx < 0 || cx - rx > 512) continue;
      const disc = ctx.createRadialGradient(cx - 10, py - 8, 4, cx, py, rx);
      disc.addColorStop(0, '#ffffff'); disc.addColorStop(0.8, '#f2f2f2'); disc.addColorStop(1, '#d8d8d8');
      ctx.fillStyle = disc;
      ctx.beginPath(); ctx.ellipse(cx, py, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.font = 'bold 54px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(num, cx, py + 3);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.Mesh(
    new THREE.SphereGeometry(R_BALL, 24, 24),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.52, metalness: 0.0, envMapIntensity: 0.55 })
  );
}

/* ================= 底座正面：福彩标志圆牌 ================= */
function makeLogo(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 256, 256);
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd28a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 84px "Microsoft YaHei", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('福', 128, 106);
  ctx.fillStyle = '#ffd28a'; ctx.font = 'bold 30px "Microsoft YaHei", Arial';
  ctx.fillText(text, 128, 226);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ================= 构建真机结构（全部世界坐标，杜绝装配错位） ================= */
function buildMachine(cfg) {
  const { cx, cz, R, cy } = cfg;
  const cosExit = Math.cos(cfg.exitHalf);
  const sphBottom = cy - R;

  /* ---- ④ 底座：深蓝直筒圆柱（对照真机：底座圆柱外半径 = 搅拌轮盘外半径 rOuter，
          正好托住轮盘外缘；等径圆柱、正面红色 LOGO、顶面透明亚克力底盘） ---- */
  const footRing = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.12, 48), blueDeep);
  footRing.position.set(cx, 0.06, cz); scene.add(footRing);
  const baseBody = new THREE.Mesh(new THREE.CylinderGeometry(0.53, 0.53, 2.44, 48), blueBase);
  baseBody.position.set(cx, 0.12 + 1.22, cz); scene.add(baseBody);           /* 顶面 y=2.50，正好托住玻璃球底 */
  const topTrim = new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.045, 10, 64), blueDeep);
  topTrim.rotation.x = Math.PI / 2; topTrim.position.set(cx, 2.50, cz); scene.add(topTrim);
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.06, 48), acrylicMat);
  tray.position.set(cx, 2.535, cz); tray.renderOrder = 5; scene.add(tray);   /* 透明亚克力底盘：边缘略伸出直筒(0.65) */
  /* 搅拌组件中心支撑柱：从底座顶面托起鼓形托壳（真机托盘下方的透明支柱） */
  const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.52, 24, 1, true), acrylicMat);
  spine.position.set(cx, 2.565 + 0.26, cz); spine.renderOrder = 6; scene.add(spine);
  /* 球壳-底座衔接（对照真机红框）：没有独立托座 —— 球壳自身下部收口成喇叭裙边，
     直接坐在底座顶面的透明亚克力盘上，滑道机构在收口裙边内部透出（见下方球壳构建） */
  const logo = new THREE.Mesh(new THREE.CircleGeometry(0.20, 40),
    new THREE.MeshStandardMaterial({ map: makeLogo(cfg.label), transparent: true, roughness: 0.5, emissive: 0x331111, emissiveIntensity: 0.4 }));
  logo.position.set(cx, 1.25, cz + 0.533);
  logo.rotation.x = -0.02; scene.add(logo);

  /* ---- ② 球状搅拌室：旋转体轮廓 = 上部完整球面 + 下部竖直圆柱筒（对照真机：
          球壳下半段是直筒壁、垂直落到托盘上，不是喇叭/锥形收口），
          仅下前方出球孔由透明短管衔接 ---- */
  const shellPts = [];
  const skirtR = 0.65;                                  /* 直筒半径：罩住转轮(0.53)，滑槽贴壁穿过 */
  const skirtStartY = -Math.sqrt(R * R - skirtR * skirtR); /* 球面→直筒切点 y≈-0.835R */
  for (let i = 0; i <= 40; i++) {
    const th = (i / 40) * Math.acos(skirtStartY / R);
    shellPts.push(new THREE.Vector2(Math.sin(th) * R, Math.cos(th) * R));
  }
  const skirtBottomY = 2.565 - cy;                      /* ≈ -1.695，直筒垂直坐进托盘顶面 */
  shellPts.push(new THREE.Vector2(skirtR, skirtBottomY));
  const main = new THREE.Mesh(new THREE.LatheGeometry(shellPts, 48), glassMat);
  main.position.set(cx, cy, cz); main.renderOrder = 6; scene.add(main);
  /* 赤道接缝（两个半球的可开合处，装饰） */
  const seam = new THREE.Mesh(new THREE.TorusGeometry(R, 0.018, 8, 64), blueDeep);
  seam.rotation.x = Math.PI / 2; seam.position.set(cx, cy, cz); scene.add(seam);

  /* 出球口：球径大小的透明亚克力短管 + 透明翻板档杆（真机整个取球机构都是透明的） */
  const exR = R * Math.sin(cfg.exitHalf);
  const collarLen = 0.18;
  const exCollar = new THREE.Mesh(new THREE.CylinderGeometry(exR + 0.04, exR + 0.04, collarLen, 24, 1, true), acrylicMat);
  exCollar.renderOrder = 6;
  exCollar.position.set(cx, cy, cz).addScaledVector(cfg.exitDir, R + collarLen / 2 - 0.06);
  exCollar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  scene.add(exCollar);
  const valvePivot = new THREE.Group();
  valvePivot.position.set(cx, cy, cz).addScaledVector(cfg.exitDir, R - 0.02);   /* 贴在孔口平面上 */
  valvePivot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(exR + 0.035, exR + 0.035, 0.035, 24),
    new THREE.MeshPhysicalMaterial({ color: 0xbfd8ff, metalness: 0, roughness: 0.08, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, envMapIntensity: 1.1 }));
  valve.position.y = 0.02; valve.renderOrder = 6; valvePivot.add(valve);
  scene.add(valvePivot);

  /* ---- 搅拌室底部（对照真机渲染图）：大托盘 + 托盘上的小型双转子 + 鼓形托壳藏电机。
          球坐在托盘上；内盘/外环带尺寸很小（Ø0.40 / Ø0.90，球径 Ø2.36），
          反向不同速，凸起为半球拨凸；除电机/转轴外全透明有机玻璃 ---- */
  const discSpins = [];
  const rotorY = cfg.discY;
  const brightMetal = new THREE.MeshStandardMaterial({ color: 0xdde4f5, metalness: 0.9, roughness: 0.28, envMapIntensity: 1.2 });
  /* 静态支撑盘（转轮下面的托板，出球孔处开孔）+ 转轮外围的静止托环（球堆外圈坐上面） */
  {
    const supShape = new THREE.Shape(); supShape.absarc(0, 0, 0.49, 0, Math.PI * 2);
    const supGeo = new THREE.ExtrudeGeometry(supShape, { depth: 0.04, bevelEnabled: false, curveSegments: 48 });
    supGeo.rotateX(-Math.PI / 2);
    const sup = new THREE.Mesh(supGeo, acrylicMat);
    sup.position.set(cx, rotorY - 0.045, cz); sup.renderOrder = 6; scene.add(sup);
    /* 托盘顶面(转子下方0.005)与转轮/内盘顶面错开 —— 三者原共面于 rotorY+0.05，
       旋转面与静止面共面产生随转动闪烁的 Z-fighting 锯齿（用户截图红框） */
  }
  /* 鼓形托壳 + 藏在里面的电机与转轴（参考图：外面只看到透明鼓身） */
  {
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.14, 32, 1, true), acrylicMat);
    drum.position.set(cx, rotorY - 0.07, cz); drum.renderOrder = 6; scene.add(drum);
    const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.09, 24), brightMetal);
    motor.position.set(cx, rotorY - 0.05, cz); scene.add(motor);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.06, 10), brightMetal);
    shaft.position.set(cx, rotorY - 0.03, cz); scene.add(shaft);
  }
  /* 内盘（r ≤ rHub，3 个半球拨凸） */
  const inner = new THREE.Group();
  inner.position.set(cx, rotorY, cz); scene.add(inner);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rHub, cfg.rHub, 0.05, 32), acrylicMat);
  hub.position.y = 0.025; hub.renderOrder = 6; inner.add(hub);
  /* 拨块：内圈 2 小块（真机同款） */
  const wedgeIn = new THREE.CylinderGeometry(0.035, 0.060, 0.060, 4, 1);
  wedgeIn.rotateY(Math.PI / 4);
  for (let k = 0; k < 2; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 2 * Math.PI * 2 + 0.4;
    const blk = new THREE.Mesh(wedgeIn, acrylicMat);
    blk.position.set(cfg.rHub * 0.62, 0.06, 0); blk.renderOrder = 6;
    hold.add(blk); inner.add(hold);
  }
  discSpins.push(inner);
  /* 外环带（gapInner → rOuter，外缘紧贴球壁 —— 真机形态，周围不多一圈）。

  const outer = new THREE.Group();
  outer.position.set(cx, rotorY, cz); scene.add(outer);
  const ringShape = new THREE.Shape(); ringShape.absarc(0, 0, cfg.rOuter, 0, Math.PI * 2);
  const ringHole = new THREE.Path(); ringHole.absarc(0, 0, cfg.gapInner, 0, Math.PI * 2);
  ringShape.holes.push(ringHole);
  const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: 0.05, bevelEnabled: false, curveSegments: 48 });
  ringGeo.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, acrylicMat);
  ring.renderOrder = 6; outer.add(ring);
  /* 外圈 4 大块（真机同款），贴外缘骑贴壁球堆 */
  const wedgeOut = new THREE.CylinderGeometry(0.045, 0.070, 0.070, 4, 1);
  wedgeOut.rotateY(Math.PI / 4);
  for (let k = 0; k < 4; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 4 * Math.PI * 2;
    const blk = new THREE.Mesh(wedgeOut, acrylicMat);
    blk.position.set(cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.93, 0.07, 0); blk.renderOrder = 6;
    hold.add(blk); outer.add(hold);
  }
  /* 盘面凸圈（真机同款挡圈）：球聚在圈上被拨块打；随外盘转动（圆环体对称，视觉不动） */
  const bead = new THREE.Mesh(new THREE.TorusGeometry(cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.55, 0.035, 12, 64), acrylicMat);
  bead.rotation.x = Math.PI / 2; bead.position.y = 0.05; bead.renderOrder = 6; outer.add(bead);
  discSpins.push(outer);

  /* ---- ① 号码球预览架（对照参考图）：等长透明管沿一条弧排成单排（冠形），
          插在球壳正后方，管身微外倾，管底削尖伸入球壳内部；摇奖前球全在管内。

  const rackDefs = [];
  {
    const N = cfg.rackN, rt = cfg.rackRR * R, L = cfg.rackLen;
    const per = Math.floor(cfg.count / N), rem = cfg.count % N;
    const step = (R_BALL * 2 + 0.005) / rt;          /* 相邻管相切：弧距 = 管径，紧密排列 */
    let byMin = 1e9;
    for (let i = 0; i < N; i++) {
      const a = (i - (N - 1) / 2) * step;            /* 0 = 正后方，全部竖直 */
      const bx = cx + Math.sin(a) * rt;
      const bz = cz - Math.cos(a) * rt;

      /* 管身：等长竖直、顶部齐平，底部长斜切一刀（参考图：细长椭圆斜切口，前缘低后缘高） */
      const cutH = cfg.tubeR * 2.4;                    /* 斜切面高度差（拉长切口） */
      const tubeGeo = new THREE.CylinderGeometry(cfg.tubeR, cfg.tubeR, L, 20, 1, true);
      {
        const pos = tubeGeo.attributes.position;
        for (let vi = 0; vi < pos.count; vi++) {
          if (pos.getY(vi) < 0) pos.setY(vi, -L / 2 + cutH / 2 * (pos.getZ(vi) / cfg.tubeR));
        }
        tubeGeo.computeVertexNormals();
      }
      const tube = new THREE.Mesh(tubeGeo, acrylicMat);
      tube.position.set(bx, by + L / 2, bz);
      tube.renderOrder = 7; scene.add(tube);
      /* 斜切椭圆封口面 */
      const capGeo = new THREE.CircleGeometry(cfg.tubeR, 24);
      capGeo.rotateX(-Math.PI / 2);
      capGeo.scale(1, 1, cutH / 2 / cfg.tubeR);
      const cap = new THREE.Mesh(capGeo, acrylicMat);
      cap.position.set(bx, by, bz);
      cap.rotation.x = -Math.atan(cutH / 2 / cfg.tubeR);
      cap.renderOrder = 7; scene.add(cap);
    }
    /* 顶部盖板（参考图）：扇形环板随管排弧度弯曲（圆心=球心，径向带包住管圈），
       每个管位开圆洞、管从洞中穿过 */
    {
      const aH = (N - 1) / 2 * step + 0.09;          /* 板半张角（管排外只留窄边） */
      const cShape = new THREE.Shape();
      cShape.absarc(0, 0, rt + 0.17, Math.PI / 2 - aH, Math.PI / 2 + aH, false);
      cShape.absarc(0, 0, rt - 0.17, Math.PI / 2 + aH, Math.PI / 2 - aH, true);
      cShape.closePath();
      for (let i = 0; i < N; i++) {
        const a = (i - (N - 1) / 2) * step;
        const hole = new THREE.Path();
        hole.absarc(Math.sin(a) * rt, Math.cos(a) * rt, cfg.tubeR + 0.02, 0, Math.PI * 2, true);
        cShape.holes.push(hole);
      }
      const cGeo = new THREE.ExtrudeGeometry(cShape, { depth: 0.035, bevelEnabled: false, curveSegments: 48 });
      cGeo.rotateX(-Math.PI / 2);                    /* 竖直成型 → 水平放倒，板顶朝 +Y */
      const cover = new THREE.Mesh(cGeo, acrylicMat);
      cover.position.set(cx, byMin + L - 0.005, cz); /* 板底略低于管口，管穿进洞里 */
      cover.renderOrder = 7; scene.add(cover);
    }
    /* 闸门挡板：水平托板贴在管底斜切口下方，摇奖前托住整排管里的球，
       开始摇奖时向后抽开松球 */
    const gateY = byMin + 0.098;                     /* 托板顶面贴球底（球底 = byMin + 0.12） */
    const gateZ = cz - rt * 0.66;
    const chord = 2 * rt * Math.sin((N - 1) / 2 * step) + 0.35;
    const plate = new THREE.Mesh(new THREE.BoxGeometry(chord, 0.045, 0.8), acrylicMat);
    plate.position.set(cx, gateY, gateZ);
    plate.renderOrder = 7; scene.add(plate);
    var gatePlate = plate, gateBaseZ = gateZ;
  }

  /* ---- ③ 出球滑道（两段式，对照真机视频/参考图）：半开槽 + 支撑柱
          出球孔 → 接引短槽 → 上层槽右滚 → 末端洞掉落 → 下层槽左滚 → 取球位 ---- */
  {
    /* 滑道 = 半开槽（U 形半管，对照真机：不是裸管）+ 端板 + 支撑柱 */
    const TUBE_R = R_BALL + 0.035;
    function trough(pts, segs) {
      for (let i = 0; i < pts.length - 1; i++) {
        const A = new THREE.Vector3(cx + pts[i][0], pts[i][1], cz + pts[i][2]);
        const B = new THREE.Vector3(cx + pts[i + 1][0], pts[i + 1][1], cz + pts[i + 1][2]);
        const dir = B.clone().sub(A); const len = dir.length(); dir.normalize();
        const geo = new THREE.CylinderGeometry(TUBE_R, TUBE_R, len + 0.01, 20, 1, true, 0, Math.PI);
        const mesh = new THREE.Mesh(geo, acrylicMat);
        mesh.position.copy(A).addScaledVector(dir, len / 2);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        /* 半壳默认在局部 +x 侧：若变换后朝上则翻转 180°，让开口永远朝上 */
        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(mesh.quaternion);
        if (side.y > 0) mesh.rotateY(Math.PI);
        mesh.renderOrder = 7; scene.add(mesh);
      }
      /* 端板（闭端） */
      for (const [p, nx] of segs) {
        if (nx === null) continue;
        const plate = new THREE.Mesh(new THREE.CylinderGeometry(TUBE_R, TUBE_R, 0.03, 20), acrylicMat);
        plate.position.set(cx + p[0], p[1], cz + p[2]);
        plate.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), nx.clone().normalize());
        plate.renderOrder = 7; scene.add(plate);
      }
    }
    const lowDir = new THREE.Vector3(cx + LOWER_PTS[1][0] - (cx + LOWER_PTS[0][0]), LOWER_PTS[1][1] - LOWER_PTS[0][1], cz + LOWER_PTS[1][2] - (cz + LOWER_PTS[0][2])).normalize();
    trough(INTRO_PTS, [[INTRO_PTS[0], new THREE.Vector3(0, 1, 0)], [null, null]]);
    trough(UPPER_PTS, [[UPPER_PTS[0], new THREE.Vector3(0, 1, 0)], [null, null]]);   /* 末端=洞 */
    trough(LOWER_PTS, [[LOWER_PTS[0], lowDir], [null, null]]);                       /* 右端板兜底 */
    /* 左端挡块：竖直挡板 + 视觉柱 */
    const stopX = cx + LOWER_PTS[2][0], stopY = LOWER_PTS[2][1], stopZ = cz + LOWER_PTS[2][2];
    const stopPlate = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.30, TUBE_R * 2 + 0.05), acrylicMat);
    stopPlate.position.set(stopX + 0.055, stopY - 0.02, stopZ); stopPlate.renderOrder = 7; scene.add(stopPlate);
    /* 支撑柱：从底盘 2.565 顶到滑道底部 */
    const postY0 = 2.565;
    for (const [px, py, pz] of [
      [cx + 0.60, UPPER_PTS[1][1], cz + 0.70],          /* 上层槽中段 */
      [cx + 0.00, LOWER_PTS[1][1], cz + 0.52],          /* 下层槽中段 */
      [stopX, stopY, stopZ],                            /* 取球位端 */
    ]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, py - TUBE_R - postY0, 10), acrylicMat);
      post.position.set(px, (py - TUBE_R + postY0) / 2, pz); post.renderOrder = 7; scene.add(post);
    }

  const glow = new THREE.PointLight(0xffffff, 0.38, R * 3.5);
  glow.position.set(cx, cy, cz); scene.add(glow);

  /* ---- 球：初始停在预览架竖管内（管内可叠多颗） ---- */
  const m = {
    ...cfg, discSpins, valvePivot, rackDefs, gatePlate, gateZ0: gateBaseZ,
    balls: [], agit: 0, agitTarget: 0,
    loadOpen: false, holeOpen: false,
    cosExit, exitDirW: cfg.exitDir.clone(),
    exitW: new THREE.Vector3(cx, cy, cz).addScaledVector(cfg.exitDir, R),
    phase: 'idle', timer: 0, drawsLeft: cfg.key === 'red' ? 6 : 1,
    capturedBall: null, doneCount: 0,
    /* 拨块：真实物理件（与视觉梯形块同尺寸同转速），碰撞实际拨动小球 */
    pegList: [
      { r: cfg.rHub * 0.62, rp: 0.055, w: cfg.wInner, rot: 0, n: 2, ph: 0.4 },
      { r: cfg.gapInner + (cfg.rOuter - cfg.gapInner) * 0.93, rp: 0.065, w: cfg.wOuter, rot: 1, n: 4, ph: 0 },
    ],
    rotPhase: [0, 0],
  };
  /* 编号随机洗牌（Fisher–Yates）：出球由物理选位置，编号↔位置每局随机，
     否则顺序摆放会让确定性物理每局都开出相近的号 */
  const nums = Array.from({ length: cfg.count }, (_, i) => i + 1);
  for (let i = nums.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [nums[i], nums[j]] = [nums[j], nums[i]];
  }
  let idx = 0;
  for (const td of rackDefs) {
    for (let k = 0; k < td.n; k++) {
      if (idx >= nums.length) break;
      const num = nums[idx++];
      const mesh = makeBallMesh(num, ballColor(num, cfg.key));
      const sT = R_BALL + 0.12 + k * (R_BALL * 2 + 0.01);
      const home = td.base.clone().addScaledVector(td.dir, sT);
      const b = { num, p: home.clone(), home, tube: td, sT, vsT: 0,
        v: new THREE.Vector3(), mesh, state: 'rack', placed: false, m };
      m.balls.push(b);
      mesh.position.copy(home);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      scene.add(mesh);
    }
  }
  machines.push(m);
  return m;
}

/* ================= 物理 ================= */
const _rel = new THREE.Vector3(), _n = new THREE.Vector3(), _t = new THREE.Vector3(), _dir = new THREE.Vector3();

function stepInBall(b, m, dt) {
  const v = b.v, p = b.p;

  /* 预览管内：沿管轴一维下滑，到达管底削尖端即脱离进球壳 */
  if (b.tube) {
    b.vsT += -G * b.tube.dir.y * dt;
    b.vsT *= (1 - 0.25 * dt);
    b.sT += b.vsT * dt;
    if (b.sT <= R_BALL + 0.08) b.tube = null;      /* 滑出管底口 */
    else {
      b.p.copy(b.tube.base).addScaledVector(b.tube.dir, b.sT);
      v.copy(b.tube.dir).multiplyScalar(b.vsT);
      return;
    }
  }

  v.y -= G * dt;

  if (m.agit > 0.01) {
    /* 同轴双转子（专利 US6145836）：中心盘/外环盘反向不同速，切向拖带 + 拨杆弹跳 */
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rr = Math.hypot(dx, dz);
    /* 盘面摩擦拖带（球接触转盘被摩擦带动，物理等效）；主要搅拌动力来自拨块碰撞 */
    if (Math.abs(p.y - m.discY) < 0.30) {
      const w = rr < (m.rHub + m.gapInner) / 2 ? m.wInner : (rr < m.rOuter ? m.wOuter : 0);
      if (w !== 0) {
        const sp = w * m.agit * Math.min(rr, m.rOuter) * 0.42;
        v.x += -dz / (rr + 1e-4) * sp * dt;
        v.z += dx / (rr + 1e-4) * sp * dt;
      }
    }
  }

  if (m.holeOpen) {
    /* 出球口导流：把球堆引向洞口（其余球仍在搅拌） */
    _dir.subVectors(m.exitW, p);
    const dd = _dir.length();
    if (dd < m.R * 1.8) {
      v.addScaledVector(_dir.normalize(), 55 * (1 - dd / (m.R * 1.8)) * dt);
    }
  }

  const damp = m.agit > 0.01 ? 0.4 : 0.15;
  v.multiplyScalar(Math.max(0, 1 - damp * dt));
  const spd = v.length();
  if (spd > 5) v.multiplyScalar(5 / spd);        /* 限速防穿透 */
  p.addScaledVector(v, dt);

  /* 转子顶面支撑：支撑范围=盘面高度球壳内可达的最大水平半径（贴壁），球不会漏也不会悬空 */
  const floorC = m.discY + 0.05 + R_BALL;
  const prr = Math.hypot(p.x - m.cx, p.z - m.cz);
  const maxR = Math.min(Math.sqrt(Math.max(0, (m.R - R_BALL) ** 2 - (m.cy - floorC) ** 2)), m.rOuter);
  if (p.y < floorC) {
    p.y = floorC;
    if (prr > maxR) {
      const k = maxR / prr;
      p.x = m.cx + (p.x - m.cx) * k;
      p.z = m.cz + (p.z - m.cz) * k;
    }
    if (v.y < -2.2) v.y *= -0.25; else v.y = 0;
  }

  /* 落球收拢：管束跨在开口上，球直落；仅对落到开口边缘外侧的球施加向心力 */
  if (m.loadOpen && p.y > m.cy + 0.4) {
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rho = Math.hypot(dx, dz);
    const maxRho = m.R * Math.sin(m.inletHalf) - R_BALL - 0.04;
    if (rho > maxRho && rho > 0.05) {
      v.x -= dx / rho * 30 * dt;
      v.z -= dz / rho * 30 * dt;
    }
  }

  /* 搅拌室玻璃约束：顶部入球口 / 下前方出球口可穿 */
  _rel.subVectors(p, _t.set(m.cx, m.cy, m.cz));
  const d = _rel.length();
  /* 出球捕获：独立于玻璃约束 —— 开阀窗口内球到达孔口锥区并越过捕获深度（转轮前缘）即入滑道 */
  if (m.holeOpen && !m.capturedBall && d > 1e-6) {
    _n.copy(_rel).divideScalar(d);
    if (_n.dot(m.exitDirW) > m.cosExit && d > m.R - R_BALL * 1.6) {
      b.state = 'rail'; b.placed = false; b.settle = 0; b.railT = 0;
      b.p.copy(m.exitW);
      b.v.copy(m.exitDirW).multiplyScalar(0.8);
      m.capturedBall = b;
      m.holeOpen = false;               /* 真机档杆动作：出一颗立即关阀 */
      /* 已出的球留在滑道里排队（摇完后实体球排成一行 = 开奖结果） */
      return;
    }
  }
  if (d > m.R - R_BALL) {
    _n.copy(_rel).divideScalar(d);
    const inExit = m.holeOpen && _n.dot(m.exitDirW) > m.cosExit;
    if (!inExit) {
      p.copy(_t).addScaledVector(_n, m.R - R_BALL);
      const vn = v.dot(_n);
      if (vn > 0) {
        v.addScaledVector(_n, -(1 + REST_WALL) * vn);
        v.multiplyScalar(0.985);
      }
    }
  }
}

/* 出球滑道（全 3D 刚性管道）：球保留完整自由度，管壁=胶囊体内壁约束。
   段格式 [a, b, openA, openB]：open 端=洞（自由进出，如上轨末端洞），闭端=端板挡墙 */
const RAIL_SEGS = [
  [INTRO_PTS[0], INTRO_PTS[1], false, true],      /* 出球孔接引短管（下端与上轨连通） */
  [UPPER_PTS[0], UPPER_PTS[1], true, true],
  [UPPER_PTS[1], UPPER_PTS[2], true, true],       /* 上轨末端 = 洞，球滚出后自由掉落 */
  [LOWER_PTS[0], LOWER_PTS[1], false, true],      /* 下轨右端板：接住掉落球（兜底） */
  [LOWER_PTS[1], LOWER_PTS[2], true, false],      /* 左端板 = 取球位挡块 */
];
const TUBE_IN = 0.035, TUBE_BORE = R_BALL + 0.035;
const _sv = new THREE.Vector3();
function railWallCollide(b, m, dt) {
  for (const [a, c, openA, openB] of RAIL_SEGS) {
    const ax = m.cx + a[0], ay = a[1], az = m.cz + a[2];
    const dx = m.cx + c[0] - ax, dy = c[1] - ay, dz = m.cz + c[2] - az;
    const L = Math.hypot(dx, dy, dz), L2 = L * L;
    const ux = dx / L, uy = dy / L, uz = dz / L;
    let t = ((b.p.x - ax) * dx + (b.p.y - ay) * dy + (b.p.z - az) * dz) / L2;
    const rawT = t;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    const px = ax + dx * t, py = ay + dy * t, pz = az + dz * t;
    const rx = b.p.x - px, ry = b.p.y - py, rz = b.p.z - pz;
    const d = Math.hypot(rx, ry, rz);
    const inBore = d < TUBE_BORE && d > 1e-6;
    const touching = d > TUBE_IN - 0.002;        /* 接触余量：贴面静置也算接触 */
    if (!inBore) continue;
    /* 开口槽：法向朝上（球在轴线上方的槽口区）不做侧壁约束 —— 球可从上方落入 */
    const openTop = rawT > 0 && rawT < 1 && ry > 0.35 * d;
    if (rawT > 0 && rawT < 1 && touching && !openTop) {
      if (d > TUBE_IN) {
        _sv.set(rx / d, ry / d, rz / d);
        b.p.set(px + _sv.x * TUBE_IN, py + _sv.y * TUBE_IN, pz + _sv.z * TUBE_IN);
        const vn = b.v.dot(_sv);
        if (vn > 0) b.v.addScaledVector(_sv, -(1 + 0.05) * vn);   /* 近非弹性法向接触 */
      }
      /* 滚动接触约束：环向分量（绕管打转）快速衰减，沿管切向只留滚动阻力 */
      const vd = b.v.x * ux + b.v.y * uy + b.v.z * uz;
      const cx2 = b.v.x - ux * vd, cy2 = b.v.y - uy * vd, cz2 = b.v.z - uz * vd;
      const kC = 1 - 0.25, kR = 1 - 0.4 * dt;
      b.v.set(ux * vd * kR + cx2 * kC, uy * vd * kR + cy2 * kC, uz * vd * kR + cz2 * kC);
    }
    /* 端板：只看球心到端面的有向距离（不看轴向投影），球心停在板前 R_BALL */
    for (const end of [openA ? null : [ax, ay, az, -ux, -uy, -uz], openB ? null : [ax + dx, ay + dy, az + dz, ux, uy, uz]]) {
      if (!end) continue;
      const pen = (b.p.x - end[0]) * end[3] + (b.p.y - end[1]) * end[4] + (b.p.z - end[2]) * end[5];
      if (pen > -R_BALL && pen < 0) {
        const corr = -R_BALL - pen;
        b.p.x += end[3] * corr; b.p.y += end[4] * corr; b.p.z += end[5] * corr;
        const vn = b.v.x * end[3] + b.v.y * end[4] + b.v.z * end[5];
        if (vn > 0) { b.v.x -= (1 + 0.15) * vn * end[3]; b.v.y -= (1 + 0.15) * vn * end[4]; b.v.z -= (1 + 0.15) * vn * end[5]; }
      }
    }
  }
}
/* 滑道球：全 3D 弹道 + 管壁/端板约束。出孔后停顿=落地碰撞自然耗散（无脚本计时）；
   入位=球在下轨自行停稳（显示事件，非物理干预） */
function stepRailBall(b, m, dt) {
  b.railT = (b.railT || 0) + dt;
  b.v.y -= G * dt;
  b.p.addScaledVector(b.v, dt);
  railWallCollide(b, m, dt);
  if (!b.placed) {
    const sp = b.v.length();
    const inLow = b.p.y < LOWER_PTS[0][1] + 0.06 && Math.abs(b.p.x - m.cx) < 1.35;
    if (inLow && sp < 0.12) b.settle += dt; else b.settle = 0;
    if (b.settle > 0.35) { b.placed = true; onBallPlaced(b, m); }
  }
}

/* 预览管内排队：同管球保持间距，只向上推 */
function collideTubes(m) {
  const byTube = new Map();
  for (const b of m.balls) {
    if (!b.tube) continue;
    if (!byTube.has(b.tube)) byTube.set(b.tube, []);
    byTube.get(b.tube).push(b);
  }
  const minD = R_BALL * 2 + 0.005;
  for (const arr of byTube.values()) {
    arr.sort((a, c) => a.sT - c.sT);
    for (let i = 0; i < arr.length - 1; i++) {
      const lo = arr[i], up = arr[i + 1];
      if (up.sT < lo.sT + minD) up.sT = lo.sT + minD;
    }
  }
}

/* 球-球碰撞（同组） */
function collideGroup(arr) {
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      _rel.subVectors(b.p, a.p);
      const d = _rel.length(), min = R_BALL * 2;
      if (d > 1e-6 && d < min) {
        _n.copy(_rel).divideScalar(d);
        const overlap = min - d;
        a.p.addScaledVector(_n, -overlap * 0.5);
        b.p.addScaledVector(_n, overlap * 0.5);
        const rv = _dir.subVectors(b.v, a.v).dot(_n);
        if (rv < 0) {
          const imp = -(1 + REST_BALL) * rv * 0.5;
          a.v.addScaledVector(_n, -imp);
          b.v.addScaledVector(_n, imp);
        }
      }
    }
  }
}

/* ================= 流程控制（真机顺序，PLC 按固定搅拌间隔出球） ================= */
const state = { running: false, currentIdx: 0 };
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');

function startShow() {
  if (state.running) return;
  state.running = true;
  state.currentIdx = 0;
  startBtn.disabled = true; resetBtn.disabled = true;
  beginMachine(machines[0]);
}
function beginMachine(m) {
  m.phase = 'loading'; m.timer = 0;
  setPhase(m.key === 'red' ? '预览架挡板开启 · 号码球落入搅拌室' : '蓝球机：预览架挡板开启 · 落球', true);
}
function onBallPlaced(b, m) {
  const totalIdx = m.key === 'red' ? m.doneCount : 6;
  const el = slotEls[totalIdx];
  if (el) { el.textContent = b.num; el.classList.add('filled', 'pop'); }
  m.doneCount++;
}

function updateMachine(m, dt) {
  m.timer += dt;
  if (m.phase === 'loading') {
    /* 抽出闸门挡板：向后（-Z）抽开 0.5s，然后松球 */
    if (m.gatePlate) m.gatePlate.position.z = m.gateZ0 - Math.min(1, m.timer / 0.5) * 0.85;
    if (m.timer > 0.8 && !m.loadOpen) {
      m.loadOpen = true;                     /* 挡板已抽开：管内球沿管滑落进球壳 */
      for (const b of m.balls) { b.state = 'in'; b.vsT = 0; b.v.set(0, 0, 0); }
    }
    /* 球全部脱离预览管并落稳（宽阈值 + 超时兜底，避免死锁） */
    if (m.loadOpen && (m.balls.every(b => !b.tube && b.p.y < m.cy + m.R * 0.45) || m.timer > 8)) {
      m.loadOpen = false;
      m.phase = 'stir'; m.timer = 0; m.agitTarget = 1;
      setPhase('搅拌底盘双向旋转 · 充分搅拌中', true);
    }
  } else if (m.phase === 'stir') {
    if (m.timer > 3) {
      m.phase = 'draw'; m.timer = 0; m.holeOpen = true;
      setPhase('出球口档杆开启 · 等待出球', true);
    }
  } else if (m.phase === 'draw') {
    /* 纯物理出球：开阀后拨块持续搅拌，球堆自然流动到孔口即捕获，无任何兜底作弊 */
    if (m.capturedBall && m.capturedBall.placed) {
      m.capturedBall = null;
      m.drawsLeft--;
      if (m.drawsLeft > 0) {
        m.phase = 'stir'; m.timer = 0;
        setPhase('其余球持续搅拌 · 准备下一球', true);
      } else {
        m.phase = 'done'; m.agitTarget = 0.12;
      }
    }
  } else if (m.phase === 'done') {
    if (state.currentIdx < machines.length - 1) {
      state.currentIdx++;
      beginMachine(machines[state.currentIdx]);
    } else if (machines.every(mm => mm.phase === 'done')) {
      state.running = false;
      startBtn.disabled = true; resetBtn.disabled = false;
      setPhase('本期开奖完成', false);
    }
  }

  m.agit += (m.agitTarget - m.agit) * Math.min(1, dt * 2);
  /* 视觉盘相位直接取物理相位 —— 拨块视觉与拨块碰撞严格同帧 */
  m.discSpins[0].rotation.y = m.rotPhase[0];
  m.discSpins[1].rotation.y = m.rotPhase[1];
  m.valvePivot.rotation.x = -(m.holeOpen ? 1 : 0) * 1.5;

  /* 球物理：按真实时间累积子步（固定步长 1/120），保证任何帧率下速度一致 */
  m.acc = (m.acc || 0) + dt;
  let sub = 0;
  while (m.acc >= DT && sub < 8) {
    const inBalls = [], railBalls = [];
    for (const b of m.balls) {
      if (b.state === 'in') { stepInBall(b, m, DT); inBalls.push(b); }
      else if (b.state === 'rail') { stepRailBall(b, m, DT); railBalls.push(b); }
    }
    collideGroup(inBalls);
    collideTubes(m);
    collideGroup(railBalls);                       /* 滑道球 3D 球球碰撞（管壁约束对齐成队） */
    /* 旋转拨块：真实物理件，逐块碰撞把球实际拨动（混合的动力来源） */
    if (m.agit > 0.01) {
      m.rotPhase[0] += m.wInner * m.agit * DT;
      m.rotPhase[1] += m.wOuter * m.agit * DT;
      for (const b of inBalls) {
        if (Math.abs(b.p.y - m.discY - 0.09) > 0.14) continue;
        for (const pg of m.pegList) {
          for (let k = 0; k < pg.n; k++) {
            const th = m.rotPhase[pg.rot] + pg.ph + k / pg.n * Math.PI * 2;
            const px = m.cx + Math.cos(th) * pg.r, pz = m.cz - Math.sin(th) * pg.r;
            const dx = b.p.x - px, dz = b.p.z - pz;
            const dd = Math.hypot(dx, dz), minD = R_BALL + pg.rp;
            if (dd < minD && dd > 1e-6) {
              const nx = dx / dd, nz = dz / dd;
              b.p.x = px + nx * minD; b.p.z = pz + nz * minD;
              /* 拨块表面速度（绕 y 转，视觉 rotation.y=th → 世界 (cos,-sin)） */
              const svx = -pg.w * m.agit * pg.r * Math.sin(th);
              const svz = -pg.w * m.agit * pg.r * Math.cos(th);
              const rvx = b.v.x - svx, rvz = b.v.z - svz;
              const vn = rvx * nx + rvz * nz;
              if (vn < 0) { b.v.x -= vn * nx * 1.05; b.v.z -= vn * nz * 1.05; }
              b.v.x += (svx - b.v.x) * 0.45; b.v.z += (svz - b.v.z) * 0.45;
              /* 撞击点在球心下方：正面撞击把球向前上方挑起，产生真实翻滚 */
              if (vn < -0.5) b.v.y += Math.min(-vn, 2.0) * 0.15;
            }
          }
        }
      }
    }
    /* 盘面凸圈（真机同款挡圈）：低挡环随外盘刚体转动（全速摩擦，比拖带 0.55 快 →
       持续犁过球层），球被拨块推压或堆挤撞圈时被垫起翻越/弹回 —— 打断贴盘公转层 */
    if (m.agit > 0.01) {
      const rc = 0.035, ringR = m.gapInner + (m.rOuter - m.gapInner) * 0.55;
      const topY = m.discY + 0.05, sv = m.wOuter * m.agit * ringR;
      for (const b of inBalls) {
        const bx = b.p.x - m.cx, bz = b.p.z - m.cz;
        const br = Math.hypot(bx, bz);
        if (br < 1e-4 || Math.abs(b.p.y - topY) > 0.4) continue;
        const dr = br - ringR, dy = b.p.y - topY;
        const dd = Math.hypot(dr, dy), minD = R_BALL + rc;
        if (dd < minD && dd > 1e-6) {
          const nr = dr / dd, ny = dy / dd, push = minD - dd;
          const ux = bx / br, uz = bz / br;
          b.p.x += ux * push * nr; b.p.z += uz * push * nr; b.p.y += push * ny;
          /* 法向低弹性缓冲 */
          const nvx = ux * nr, nvy = ny, nvz = uz * nr;
          const vn = b.v.x * nvx + b.v.y * nvy + b.v.z * nvz;
          if (vn < 0) { b.v.x -= vn * nvx * 1.3; b.v.y -= vn * nvy * 1.3; b.v.z -= vn * nvz * 1.3; }
          /* 切向：圈面刚体转速（无打滑），把贴圈球带到全速 */
          const tx = -uz, tz = ux;
          const dv = sv - (b.v.x * tx + b.v.z * tz);
          b.v.x += tx * dv * 0.5; b.v.z += tz * dv * 0.5;
        }
      }
    }
    /* 护城河清扫：碰撞把球挤到轮缘外的话，收回转轮支撑圈（球始终落在转轮上） */
    {
      const fl = m.discY + 0.05 + R_BALL;
      const mR = Math.min(Math.sqrt(Math.max(0, (m.R - R_BALL) ** 2 - (m.cy - fl) ** 2)), m.rOuter);
      for (const b of inBalls) {
        if (b.p.y < fl) {
          const bx = b.p.x - m.cx, bz = b.p.z - m.cz, br = Math.hypot(bx, bz);
          if (br > mR) {
            const k = mR / br;
            b.p.x = m.cx + bx * k; b.p.z = m.cz + bz * k;
          }
        }
      }
    }
    m.acc -= DT; sub++;
  }
  if (m.acc > DT * 8) m.acc = 0;   /* 卡顿后丢弃积压，避免爆炸 */

  /* mesh 同步 + 滚动旋转（球面多数字，入位后保持原姿态即可，无需摆正） */
  for (const b of m.balls) {
    if (b.state === 'rack') continue;
    if (!b.placed) {
      const sp = Math.hypot(b.v.x, b.v.z);
      if (sp > 0.05) {
        b.mesh.rotation.x -= b.v.z / R_BALL * DT * 0.9;
        b.mesh.rotation.z += b.v.x / R_BALL * DT * 0.9;
      }
    }
    b.mesh.position.copy(b.p);
  }
}

/* ================= 重置 ================= */
function resetAll() {
  for (const m of machines) {
    m.phase = 'idle'; m.agit = 0; m.agitTarget = 0;
    m.loadOpen = false; m.holeOpen = false;
    m.capturedBall = null; m.doneCount = 0; m.timer = 0;
    m.valvePivot.rotation.x = 0;
    if (m.gatePlate) m.gatePlate.position.z = m.gateZ0;
    m.drawsLeft = m.key === 'red' ? 6 : 1;
    for (const b of m.balls) {
      b.p.copy(b.home);
      b.v.set(0, 0, 0);
      b.state = 'rack'; b.placed = false; b.railT = 0; b.settle = 0;
      b.sT = b.home ? R_BALL + 0.12 : 0;
      b.tube = null;
      /* 重新挂回各自的预览管（按 home 找归属管） */
      for (const td of m.rackDefs) {
        const rel = _dir.subVectors(b.home, td.base);
        if (Math.abs(rel.dot(td.dir) - (R_BALL + 0.12)) < R_BALL && Math.hypot(rel.x - td.dir.x * rel.dot(td.dir), rel.z - td.dir.z * rel.dot(td.dir)) < 0.05) {
          b.tube = td;
          b.sT = rel.dot(td.dir);
          break;
        }
      }
      b.vsT = 0;
      b.mesh.visible = true; b.mesh.scale.setScalar(1);
      b.mesh.position.copy(b.p);
      b.mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
    }
  }
  for (const el of slotEls) { el.textContent = ''; el.classList.remove('filled', 'pop'); }
  state.running = false;
  startBtn.disabled = false; resetBtn.disabled = true;
  setPhase('点击「开始摇奖」', false);
}
resetBtn.disabled = true;
startBtn.addEventListener('click', startShow);
resetBtn.addEventListener('click', resetAll);

/* ================= 主循环 ================= */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.running || machines.some(m => m.phase !== 'idle')) {
    for (const m of machines) {
      if (m.phase !== 'idle') updateMachine(m, dt);
    }
  }
  controls.update();
  composer.render();
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
