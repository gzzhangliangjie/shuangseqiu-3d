  #title {
    font-size: 25px; font-weight: 700; letter-spacing: 4px;

  #results { display: flex; gap: 13px; justify-content: center; margin-top: 14px; }

  #controls { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 10; }

  #startBtn { background: linear-gradient(135deg, #e53935, #b71c1c); box-shadow: 0 4px 24px rgba(229,57,53,.45); }

  #resetBtn { background: rgba(255,255,255,.08); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #tip { position: fixed; bottom: 10px; right: 16px; font-size: 12px; color: rgba(255,255,255,.35); z-index: 10; }
  #legend {
    position: fixed; top: 16px; left: 18px; font-size: 12.5px; line-height: 1.85;
    color: rgba(255,255,255,.55); z-index: 10;
  }
  #legend b { color: #fff; }
</style>

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ================= 场景基础 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1026, 30, 80);

/* 环境反射（PBR 质感的关键） */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4.6, 13.8);

/* 后期：轻辉光 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.55, 0.82);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.3, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 6;
controls.maxDistance = 36;

scene.add(new THREE.HemisphereLight(0x9db0ff, 0x1a2038, 0.9));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.35); dir1.position.set(7, 14, 9); scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x7f9dff, 0.5); dir2.position.set(-9, 7, -7); scene.add(dir2);

/* 展台 */
const plat = new THREE.Mesh(
  new THREE.CylinderGeometry(11, 11.6, 0.6, 64),
  new THREE.MeshStandardMaterial({ color: 0x1c2444, roughness: 0.55, metalness: 0.35 })
);
plat.position.y = -0.3; scene.add(plat);
const rim = new THREE.Mesh(

);
rim.rotation.x = Math.PI / 2; rim.position.y = 0.02; scene.add(rim);

/* 星空背景 */
{
  const N = 700, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 42 + Math.random() * 32, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 6;

/* ================= 物理常量 =================
   比例对齐真机：1 单位 ≈ 0.296m（底座 0.77m = 2.6 单位）
   搅拌室 Ø0.70m → R=1.18；摇奖球 Ø0.05m 真实比例过小，取 R=0.20 保证号码可读 */
const R_BALL = 0.20;
const G = 22;
const REST_BALL = 0.55;
const REST_WALL = 0.62;
const DT = 1 / 120;

const machines = [];
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb9c3e2, metalness: 1, roughness: 0.2, envMapIntensity: 1.3 });
const goldMat  = new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 1, roughness: 0.24, envMapIntensity: 1.35 });
const blueBase = new THREE.MeshStandardMaterial({ color: 0x27357e, roughness: 0.35, metalness: 0.55 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaccff, metalness: 0, roughness: 0.05,
  transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.2
});
const acrylicMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfd8ff, metalness: 0, roughness: 0.08,
  transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.1
});

/* ============ 真机几何参数（底座 0.77 / 搅拌室 0.83 / 预览架 0.42） ============ */
const MACH_CFG = [
  {
    key: 'red', cx: -3.8, cz: 0, count: 33, color: '#d0342c', label: '1 号机 · 红球区',
    baseH: 2.6, baseRT: 1.30, baseRB: 1.55,
    R: 1.18, cy: 3.68,
    inletHalf: 55 * Math.PI / 180,             /* 搅拌室顶部大开口（预览架正下方） */
    exitHalf: 30 * Math.PI / 180,              /* 出球口：底部前偏 30°，球堆直接够得到 */
    exitDir: new THREE.Vector3(0, -0.868, 0.496),
    discDX: 0.55, discR: 0.50, discY: 2.95,
    tubeGrid: [4, 4], tubePitch: 0.48, tubeR: 0.22, tubeH: 0.95, ballsPerTube: 2,
    chuteZ0: 0.9, chuteTopY: 2.42, chuteSlope: 0.75, chuteZ1: 2.9,
    chanZ: 3.45, chanHalfW: 0.34, chanBaseY: 0.92,
    rollDir: -1, stopX: -7.0, chanX1: -7.5, chanX2: -2.6, entryX: -3.8
  },
  {
    key: 'blue', cx: 3.8, cz: 0, count: 16, color: '#1e63c8', label: '2 号机 · 蓝球区',
    baseH: 2.6, baseRT: 1.30, baseRB: 1.55,
    R: 1.18, cy: 3.68,
    inletHalf: 55 * Math.PI / 180,
    exitHalf: 32 * Math.PI / 180,
    exitDir: new THREE.Vector3(0, -0.848, 0.53),
    discDX: 0.55, discR: 0.50, discY: 2.95,
    tubeGrid: [4, 4], tubePitch: 0.48, tubeR: 0.22, tubeH: 0.55, ballsPerTube: 1,
    chuteZ0: 0.9, chuteTopY: 2.42, chuteSlope: 0.75, chuteZ1: 2.9,
    chanZ: 3.45, chanHalfW: 0.34, chanBaseY: 0.92,
    rollDir: 1, stopX: 7.0, chanX1: 2.6, chanX2: 7.5, entryX: 3.8
  },
];

/* ================= 号码球贴图：4 个白圆片号码（每 90° 一个） ================= */
function makeBallMesh(num, color) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 512, 256);
  const grad = ctx.createRadialGradient(160, 70, 20, 256, 128, 280);
  grad.addColorStop(0, 'rgba(255,255,255,.30)'); grad.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
  for (const cx of [64, 192, 320, 448]) {
    const disc = ctx.createRadialGradient(cx - 14, 114, 6, cx, 128, 58);
    disc.addColorStop(0, '#ffffff'); disc.addColorStop(0.8, '#f2f2f2'); disc.addColorStop(1, '#d8d8d8');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(cx, 128, 54, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 76px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(num, cx, 132);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.Mesh(
    new THREE.SphereGeometry(R_BALL, 24, 24),
    new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.26, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 0.9 })
  );
}

/* ================= 底座正面：福彩标志圆牌 ================= */
function makeLogo(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 256, 256);
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd28a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 84px "Microsoft YaHei", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('福', 128, 106);
  ctx.fillStyle = '#ffd28a'; ctx.font = 'bold 30px "Microsoft YaHei", Arial';
  ctx.fillText(text, 128, 226);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ================= 构建真机结构 ================= */
function buildMachine(cfg) {
  const group = new THREE.Group();
  const { cx, cz, R, cy } = cfg;

  /* ---- ④ 底座（0.77m）：深蓝圆台，内藏 PLC/电机/变频器 ---- */
  const base = new THREE.Mesh(new THREE.CylinderGeometry(cfg.baseRT, cfg.baseRB, cfg.baseH, 48), blueBase);
  base.position.y = cfg.baseH / 2; group.add(base);
  const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(cfg.baseRT + 0.06, cfg.baseRT + 0.06, 0.1, 48), metalMat);
  baseTop.position.y = cfg.baseH + 0.05; group.add(baseTop);
  const logo = new THREE.Mesh(new THREE.CircleGeometry(0.52, 40),
    new THREE.MeshStandardMaterial({ map: makeLogo(cfg.label), transparent: true, roughness: 0.5, emissive: 0x331111, emissiveIntensity: 0.4 }));
  logo.position.set(0, cfg.baseH * 0.52, cfg.baseRB + 0.015);
  logo.rotation.x = -0.06; group.add(logo);
  /* 球底部与底座衔接的蓝座圈 */
  const socket = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.82, R * 0.95, 0.26, 40), blueBase);
  socket.position.y = cfg.baseH + 0.08; group.add(socket);

  /* ---- ② 球状搅拌室（Ø0.83m 段）：两个半球（赤道接缝），顶部大开口+滑盖挡板，下前方出球口 ---- */
  const cosInlet = Math.cos(cfg.inletHalf);
  const cosExit = Math.cos(cfg.exitHalf);
  const t0 = cfg.inletHalf, t1 = Math.PI - cfg.exitHalf * 1.15;
  const main = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32, 0, Math.PI * 2, t0, t1 - t0), glassMat);
  main.renderOrder = 6; group.add(main);
  const phiHole = 0.64;
  const lowA = new THREE.Mesh(new THREE.SphereGeometry(R, 24, 14, Math.PI / 2 + phiHole, Math.PI * 2 - phiHole * 2, t1, Math.PI - t1), glassMat);
  lowA.renderOrder = 6; group.add(lowA);
  const lowB = new THREE.Mesh(new THREE.SphereGeometry(R, 12, 4, Math.PI / 2 - phiHole, phiHole * 2, t1, 0.1), glassMat);
  lowB.renderOrder = 6; group.add(lowB);
  const lowC = new THREE.Mesh(new THREE.SphereGeometry(R, 12, 4, Math.PI / 2 - phiHole, phiHole * 2, Math.PI - 0.2, 0.2), glassMat);
  lowC.renderOrder = 6; group.add(lowC);
  /* 赤道接缝（两个半球的可开合处） */
  const seam = new THREE.Mesh(new THREE.TorusGeometry(R, 0.018, 8, 64), blueBase);
  seam.rotation.x = Math.PI / 2; group.add(seam);

  /* 顶部开口金属环 + 滑盖挡板（预览架底部的挡板） */
  const inletRing = new THREE.Mesh(new THREE.TorusGeometry(R * Math.sin(cfg.inletHalf) + 0.03, 0.045, 10, 48), metalMat);
  inletRing.rotation.x = Math.PI / 2;
  inletRing.position.y = R * cosInlet; group.add(inletRing);
  const inletCap = new THREE.Mesh(new THREE.CylinderGeometry(R * Math.sin(cfg.inletHalf) + 0.04, R * Math.sin(cfg.inletHalf) + 0.04, 0.04, 48), blueBase);
  inletCap.position.y = R * cosInlet + 0.02; group.add(inletCap);

  /* 出球口：外凸金属短管 + 翻板档杆 */
  const holeR = R * Math.sin(cfg.exitHalf);
  const collarLen = 0.5;
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(holeR + 0.05, holeR + 0.08, collarLen, 24, 1, true), metalMat);
  collar.position.copy(cfg.exitDir).multiplyScalar(R + collarLen / 2 - 0.1);
  collar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  group.add(collar);
  const valvePivot = new THREE.Group();
  valvePivot.position.copy(cfg.exitDir).multiplyScalar(R + collarLen - 0.08);
  valvePivot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(holeR + 0.07, holeR + 0.07, 0.045, 24), metalMat);
  valve.position.y = 0.02; valvePivot.add(valve);
  group.add(valvePivot);

  /* ---- 搅拌室底部：两个双向旋转搅拌盘（专利机构，斜置让开出球口） ---- */
  const discMeshes = [];
  for (const side of [-1, 1]) {
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(cfg.discR, cfg.discR, 0.07, 28),
      new THREE.MeshStandardMaterial({ color: 0x5a6a9a, metalness: 0.85, roughness: 0.3 }));
    disc.position.set(side * cfg.discDX, cfg.discY - cy, 0);
    disc.rotation.z = side * 0.5;
    group.add(disc);
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 10), metalMat);
    axle.position.set(side * cfg.discDX, cfg.discY - cy - 0.18, 0); group.add(axle);
    discMeshes.push(disc);
  }

  /* ---- ① 号码球预览架（0.42m）：竖直透明管立在搅拌室正上方，球停管内 ---- */
  const plateY = cy + R * cosInlet;            /* 挡板/管底高度（开口环平面） */
  const tubeH = cfg.tubeH;
  const [gCols, gRows] = cfg.tubeGrid;
  const pitch = cfg.tubePitch;
  const tubePos = [];
  for (let r = 0; r < gRows; r++)
    for (let c = 0; c < gCols; c++)
      tubePos.push([(c - (gCols - 1) / 2) * pitch, (r - (gRows - 1) / 2) * pitch]);
  if (cfg.ballsPerTube === 2) tubePos.push([0, 0]);   /* 红机 16×2+1=33 */
  const rackTopY = plateY + tubeH + 0.1;
  for (const [tx, tz] of tubePos) {
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(cfg.tubeR, cfg.tubeR, tubeH, 18, 1, true), acrylicMat);
    tube.position.set(tx, plateY + tubeH / 2, tz);
    tube.renderOrder = 7; group.add(tube);
  }
  /* 预览架顶部环 + 四根细柱（结构感） */
  const topRing = new THREE.Mesh(new THREE.TorusGeometry(pitch * 1.55, 0.03, 8, 48), metalMat);
  topRing.rotation.x = Math.PI / 2; topRing.position.y = rackTopY; group.add(topRing);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * Math.PI * 2 + Math.PI / 4;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, tubeH + 0.1, 8), metalMat);
    post.position.set(Math.cos(a) * pitch * 1.55, plateY + (tubeH + 0.1) / 2, Math.sin(a) * pitch * 1.55);
    group.add(post);
  }

  /* ---- ③ 出球轨道：两根平行圆管 + 显示通道 ---- */
  const z0 = cfg.chuteZ0, z1 = cfg.chuteZ1;
  const slopeLen = Math.hypot(z1 - z0, cfg.chuteTopY - cfg.chanBaseY) + 0.25;
  const slopeAng = Math.atan2(cfg.chuteTopY - cfg.chanBaseY, z1 - z0);
  const midY = (cfg.chuteTopY + cfg.chanBaseY) / 2, midZ = (z0 + z1) / 2;
  for (const sx of [-0.2, 0.2]) {
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, slopeLen, 10), goldMat);
    rod.rotation.x = Math.PI / 2 - slopeAng;
    rod.position.set(cx + sx, midY - 0.05, midZ);
    scene.add(rod);
  }
  for (const sz of [z0 + 0.35, z1 - 0.15]) {
    const fy = cfg.chuteTopY - cfg.chuteSlope * (sz - z0);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, fy, 8), metalMat);
    post.position.set(cx, fy / 2, sz); scene.add(post);
  }
  const chanLen = cfg.chanX2 - cfg.chanX1;
  for (const sx of [-0.2, 0.2]) {
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, chanLen, 10), goldMat);
    rod.rotation.z = Math.PI / 2; rod.rotation.y = Math.PI / 2;
    rod.position.set((cfg.chanX1 + cfg.chanX2) / 2, cfg.chanBaseY - 0.05, cfg.chanZ + sx);
    scene.add(rod);
  }
  for (const ex of [cfg.chanX1, cfg.chanX2, cfg.stopX]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.4, cfg.chanHalfW * 2 + 0.1), metalMat);
    wall.position.set(ex, cfg.chanBaseY + 0.1, cfg.chanZ); scene.add(wall);
  }
  for (const sz of [cfg.chanZ - cfg.chanHalfW, cfg.chanZ + cfg.chanHalfW]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(chanLen, 0.3, 0.04), acrylicMat);
    rail.position.set((cfg.chanX1 + cfg.chanX2) / 2, cfg.chanBaseY + 0.06, sz); scene.add(rail);
  }

  group.position.set(cx, cy, cz);
  scene.add(group);

  const glow = new THREE.PointLight(0xffffff, 0.6, R * 3.5);
  glow.position.set(cx, cy, cz); scene.add(glow);

  /* ---- 球：初始停在预览架竖管内 ---- */
  const m = {
    ...cfg, group, discMeshes, valvePivot, inletCap,
    balls: [], agit: 0, agitTarget: 0,
    loadOpen: false, holeOpen: false,
    cosInlet, cosExit, exitDirW: cfg.exitDir.clone(),
    exitW: new THREE.Vector3(cx, cy, cz).addScaledVector(cfg.exitDir, R),
    doorAnim: 0,
    phase: 'idle', timer: 0, drawsLeft: cfg.key === 'red' ? 6 : 1,
    capturedBall: null, doneCount: 0,
  };
  let idx = 0;
  const nTubes = tubePos.length;
  for (let t = 0; t < nTubes; t++) {
    const [tx, tz] = tubePos[t];
    const inThisTube = cfg.ballsPerTube === 2 ? (t < nTubes - 1 ? 2 : 1) : 1;
    for (let k = 0; k < inThisTube; k++) {
      const num = ++idx;
      if (num > cfg.count) break;
      const mesh = makeBallMesh(num, cfg.color);
      const p = new THREE.Vector3(cx + tx, plateY + R_BALL + 0.02 + k * (R_BALL * 2 + 0.02), tz);
      const b = { num, p, v: new THREE.Vector3(), mesh, state: 'rack', placed: false, m };
      m.balls.push(b);
      mesh.position.copy(p);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      scene.add(mesh);
    }
  }
  machines.push(m);
  return m;
}
MACH_CFG.forEach(buildMachine);

/* ================= HUD ================= */
const resultsEl = document.getElementById('results');
const phaseEl = document.getElementById('phase');
const slotEls = [];
for (let i = 0; i < 7; i++) {
  const d = document.createElement('div');
  d.className = 'slot ' + (i < 6 ? 'red' : 'blue');
  resultsEl.appendChild(d); slotEls.push(d);
}
function setPhase(t, active) { phaseEl.textContent = t; phaseEl.className = active ? 'active' : ''; }

/* ================= 物理 ================= */
const _rel = new THREE.Vector3(), _n = new THREE.Vector3(), _t = new THREE.Vector3(), _dir = new THREE.Vector3();

function stepInBall(b, m, dt) {
  const v = b.v, p = b.p;
  v.y -= G * dt;

  if (m.agit > 0.01) {
    /* 双搅拌盘：左右反向切向拖带 + 盘面弹跳（对应两个双向旋转底盘） */
    for (const side of [-1, 1]) {
      const dx = p.x - (m.cx + side * m.discDX), dz = p.z - m.cz;
      const rr = Math.hypot(dx, dz);
      if (rr < m.discR + R_BALL * 1.6 && Math.abs(p.y - m.discY) < 0.62) {
        const w = side * 13;
        const sp = w * m.agit * Math.min(rr, m.discR) * 1.3;
        v.x += -dz / (rr + 1e-4) * sp * dt;
        v.z += dx / (rr + 1e-4) * sp * dt;
        if (p.y < m.discY + 0.34 && p.y > m.discY - 0.16 && Math.random() < 0.24) {
          v.y += 7.5 * m.agit * dt * (0.5 + Math.random());
        }
      }
    }
  }

  if (m.holeOpen) {
    /* 出球口导流：把球堆引向洞口（其余球仍在搅拌） */
    _dir.subVectors(m.exitW, p);
    const dd = _dir.length();
    if (dd < m.R * 1.8) {
      v.addScaledVector(_dir.normalize(), 130 * (1 - dd / (m.R * 1.8)) * dt);
    }
  }

  const damp = m.agit > 0.01 ? 0.4 : 0.15;
  v.multiplyScalar(Math.max(0, 1 - damp * dt));
  p.addScaledVector(v, dt);

  /* 落球导流：预览架挡板打开后，把球收拢导入搅拌室顶口 */
  if (m.loadOpen && p.y > m.cy + 0.3) {
    const rho = Math.hypot(p.x - m.cx, p.z - m.cz);
    const maxRho = m.R * Math.sin(m.inletHalf) - R_BALL - 0.06;
    if (rho > maxRho) {
      const s = maxRho / rho;
      p.x = m.cx + (p.x - m.cx) * s;
      p.z = m.cz + (p.z - m.cz) * s;
      v.x *= 0.6; v.z *= 0.6;
    }
  }

  /* 搅拌室玻璃约束：顶部入球口 / 下前方出球口可穿 */
  _rel.subVectors(p, _t.set(m.cx, m.cy, m.cz));
  const d = _rel.length();
  if (d > m.R - R_BALL) {
    _n.copy(_rel).divideScalar(d);
    const inInlet = m.loadOpen && _n.y > m.cosInlet;
    const inExit = m.holeOpen && _n.dot(m.exitDirW) > m.cosExit;
    if (inExit && d > m.R + R_BALL * 0.7 && !m.capturedBall) {
      b.state = 'rail'; b.placed = false;
      m.capturedBall = b;
      m.holeOpen = false;               /* 真机档杆动作：出一颗立即关阀 */
      return;
    }
    if (!inInlet && !inExit) {
      p.copy(_t).addScaledVector(_n, m.R - R_BALL);
      const vn = v.dot(_n);
      if (vn > 0) {
        v.addScaledVector(_n, -(1 + REST_WALL) * vn);
        v.multiplyScalar(0.985);
      }
    }
  }
}

function chuteFloorY(m, z) { return m.chuteTopY - m.chuteSlope * (z - m.chuteZ0); }
function chanFloorY(m, x) { return m.chanBaseY + 0.05 * (m.stopX - x) * -m.rollDir; }

function stepRailBall(b, m, dt) {
  const v = b.v, p = b.p;
  v.y -= G * dt;
  p.addScaledVector(v, dt);

  if (p.z < m.chuteZ1) {
    /* 出球轨道斜坡段：球卡在两根圆管之间滚下 */
    p.x = m.cx + THREE.MathUtils.clamp(p.x - m.cx, -0.14, 0.14);
    v.x *= (1 - 4 * dt);
    const fY = chuteFloorY(m, p.z);
    if (p.y < fY) {
      p.y = fY;
      if (v.y < -2.2) v.y *= -0.25; else v.y = 0;
      v.z += G * m.chuteSlope * dt;
    }
    v.z *= (1 - 0.08 * dt);
  } else {
    /* 显示通道：微坡滚向挡板，球挨球排队 */
    b.railT = (b.railT || 0) + dt;
    const fY = chanFloorY(m, p.x);
    if (p.y < fY) {
      p.y = fY;
      if (v.y < -2.2) v.y *= -0.25; else v.y = 0;
      v.x += m.rollDir * G * 0.05 * dt;
    }
    v.x *= (1 - 0.5 * dt);
    if (Math.abs(p.z - m.chanZ) > 0.13) {
      p.z = m.chanZ + Math.sign(p.z - m.chanZ) * 0.13;
      v.z *= -0.2;
    }
    if (m.rollDir < 0) { if (p.x < m.stopX + R_BALL) { p.x = m.stopX + R_BALL; v.x *= -0.25; } }
    else { if (p.x > m.stopX - R_BALL) { p.x = m.stopX - R_BALL; v.x *= -0.25; } }
    /* 停稳判定（进通道至少 1.2s，保证先滚到挡板） → 入位 */
    if (!b.placed && b.railT > 1.2 && Math.abs(v.x) < 0.22 && Math.abs(v.z) < 0.18 && p.z > m.chuteZ1 - 0.05) {
      b.placed = true;
      onBallPlaced(b, m);
    }
  }
}

/* 球-球碰撞（同组） */
function collideGroup(arr) {
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      _rel.subVectors(b.p, a.p);
      const d = _rel.length(), min = R_BALL * 2;
      if (d > 1e-6 && d < min) {
        _n.copy(_rel).divideScalar(d);
        const overlap = min - d;
        a.p.addScaledVector(_n, -overlap * 0.5);
        b.p.addScaledVector(_n, overlap * 0.5);
        const rv = _dir.subVectors(b.v, a.v).dot(_n);
        if (rv < 0) {
          const imp = -(1 + REST_BALL) * rv * 0.5;
          a.v.addScaledVector(_n, -imp);
          b.v.addScaledVector(_n, imp);
        }
      }
    }
  }
}

/* ================= 流程控制（真机顺序，PLC 按固定搅拌间隔出球） ================= */
const state = { running: false, currentIdx: 0 };
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');

function startShow() {
  if (state.running) return;
  state.running = true;
  state.currentIdx = 0;
  startBtn.disabled = true; resetBtn.disabled = true;
  beginMachine(machines[0]);
}
function beginMachine(m) {
  m.phase = 'loading'; m.timer = 0; m.doorAnim = 0;
  setPhase(m.key === 'red' ? '预览架挡板开启 · 号码球落入搅拌室' : '蓝球机：预览架挡板开启 · 落球', true);
}
function onBallPlaced(b, m) {
  const totalIdx = m.key === 'red' ? m.doneCount : 6;
  const el = slotEls[totalIdx];
  if (el) { el.textContent = b.num; el.classList.add('filled', 'pop'); }
  m.doneCount++;
  b.faceTimer = 0;
}

function updateMachine(m, dt) {
  m.timer += dt;
  if (m.phase === 'loading') {
    m.doorAnim = Math.min(1, m.doorAnim + dt / 0.7);
    m.inletCap.position.x = m.doorAnim * m.R * 1.5;
    if (m.doorAnim >= 1 && !m.loadOpen) {
      m.loadOpen = true;
      for (const b of m.balls) { b.state = 'in'; b.v.set(0, 0, 0); }
    }
    if (m.loadOpen && m.balls.every(b => b.p.y < m.cy - 0.1)) {
      m.loadOpen = false;
      m.inletCap.position.x = 0;
      m.phase = 'stir'; m.timer = 0; m.agitTarget = 1;
      setPhase('搅拌底盘双向旋转 · 充分搅拌中', true);
    }
  } else if (m.phase === 'stir') {
    if (m.timer > 3) {
      m.phase = 'draw'; m.timer = 0; m.holeOpen = true;
      setPhase('出球口档杆开启 · 等待出球', true);
    }
  } else if (m.phase === 'draw') {
    if (m.timer > 3.5 && !m.capturedBall) {
      /* 兜底：给最靠近出口的球一个物理冲量 */
      let best = null, bd = 1e9;
      for (const b of m.balls) {
        if (b.state !== 'in') continue;
        const d = b.p.distanceTo(m.exitW);
        if (d < bd) { bd = d; best = b; }
      }
      if (best) {
        _dir.subVectors(m.exitW, best.p).normalize();
        best.v.addScaledVector(_dir, 6);
      }
      m.timer = 1.5;
    }
    if (m.capturedBall && m.capturedBall.placed) {
      m.capturedBall = null;
      m.drawsLeft--;
      if (m.drawsLeft > 0) {
        m.phase = 'stir'; m.timer = 0;
        setPhase('其余球持续搅拌 · 准备下一球', true);
      } else {
        m.phase = 'done'; m.agitTarget = 0.12;
      }
    }
  } else if (m.phase === 'done') {
    if (state.currentIdx < machines.length - 1) {
      state.currentIdx++;
      beginMachine(machines[state.currentIdx]);
    } else if (machines.every(mm => mm.phase === 'done')) {
      state.running = false;
      startBtn.disabled = true; resetBtn.disabled = false;
      setPhase('本期开奖完成', false);
    }
  }

  m.agit += (m.agitTarget - m.agit) * Math.min(1, dt * 2);
  if (m.agit > 0.01) {
    for (let i = 0; i < 2; i++) m.discMeshes[i].rotation.y += (i === 0 ? 13 : -13) * m.agit * dt;
  }
  m.valvePivot.rotation.x = -(m.holeOpen ? 1 : 0) * 1.5;

  /* 球物理 */
  const inBalls = [], railBalls = [];
  for (const b of m.balls) {
    if (b.state === 'in') { stepInBall(b, m, DT); inBalls.push(b); }
    else if (b.state === 'rail') { stepRailBall(b, m, DT); railBalls.push(b); }
  }
  collideGroup(inBalls);
  collideGroup(railBalls);

  /* mesh 同步 + 滚动旋转 */
  for (const b of m.balls) {
    if (b.state === 'rack') continue;
    if (b.placed) {
      b.faceTimer = (b.faceTimer ?? 0) + dt;
      const k = Math.min(1, b.faceTimer / 0.4);
      b.mesh.rotation.x *= (1 - k);
      b.mesh.rotation.z *= (1 - k);
      b.mesh.rotation.y += (-Math.PI / 4 - b.mesh.rotation.y) * k;
    } else {
      const sp = Math.hypot(b.v.x, b.v.z);
      if (sp > 0.05) {
        b.mesh.rotation.x -= b.v.z / R_BALL * DT * 0.9;
        b.mesh.rotation.z += b.v.x / R_BALL * DT * 0.9;
      }
    }
    b.mesh.position.copy(b.p);
  }
}

/* ================= 重置 ================= */
function resetAll() {
  for (const m of machines) {
    m.phase = 'idle'; m.agit = 0; m.agitTarget = 0;
    m.loadOpen = false; m.holeOpen = false;
    m.capturedBall = null; m.doneCount = 0; m.timer = 0;
    m.doorAnim = 0; m.valvePivot.rotation.x = 0;
    m.inletCap.position.x = 0;
    m.drawsLeft = m.key === 'red' ? 6 : 1;
    const plateY = m.cy + m.R * m.cosInlet;
    const nTubes = m.tubeGrid[0] * m.tubeGrid[1] + (m.ballsPerTube === 2 ? 1 : 0);
    let idx = 0;
    for (let t = 0; t < nTubes; t++) {
      const r = Math.floor(t / m.tubeGrid[0]), c = t % m.tubeGrid[0];
      const tx = (c - (m.tubeGrid[0] - 1) / 2) * m.tubePitch;
      const tz = (r - (m.tubeGrid[1] - 1) / 2) * m.tubePitch;
      const inThisTube = m.ballsPerTube === 2 ? (t < nTubes - 1 ? 2 : 1) : 1;
      for (let k = 0; k < inThisTube; k++) {
        const b = m.balls[idx++];
        if (!b) break;
        b.p.set(m.cx + tx, plateY + R_BALL + 0.02 + k * (R_BALL * 2 + 0.02), tz);
        b.v.set(0, 0, 0);
        b.state = 'rack'; b.placed = false; b.faceTimer = 0; b.railT = 0;
        b.mesh.position.copy(b.p);
        b.mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
      }
    }
  }
  for (const el of slotEls) { el.textContent = ''; el.classList.remove('filled', 'pop'); }
  state.running = false;
  startBtn.disabled = false; resetBtn.disabled = true;
  setPhase('点击「开始摇奖」', false);
}
resetBtn.disabled = true;
startBtn.addEventListener('click', startShow);
resetBtn.addEventListener('click', resetAll);

/* ================= 主循环 ================= */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.running || machines.some(m => m.balls.some(b => b.state !== 'rack' && (!b.placed || b.faceTimer < 0.5)))) {
    for (const m of machines) {
      if (m.phase !== 'idle') updateMachine(m, dt);
      else {
        for (const b of m.balls) if (b.placed && b.faceTimer < 0.5) {
          b.faceTimer += dt;
          const k = Math.min(1, b.faceTimer / 0.4);
          b.mesh.rotation.y += (-Math.PI / 4 - b.mesh.rotation.y) * k;
          b.mesh.position.copy(b.p);
        }
      }
    }
  }
  controls.update();
  composer.render();
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
