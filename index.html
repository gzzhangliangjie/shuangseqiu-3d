<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ================= 场景基础 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b1026, 30, 80);

/* 环境反射（PBR 质感的关键） */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 5.2, 13.0);

/* 后期：轻辉光 */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.55, 0.82);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.6, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 6;
controls.maxDistance = 36;

scene.add(new THREE.HemisphereLight(0x9db0ff, 0x1a2038, 0.9));
const dir1 = new THREE.DirectionalLight(0xffffff, 1.35); dir1.position.set(7, 14, 9); scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x7f9dff, 0.5); dir2.position.set(-9, 7, -7); scene.add(dir2);

/* 展台 */
const plat = new THREE.Mesh(
  new THREE.CylinderGeometry(11, 11.6, 0.6, 64),
  new THREE.MeshStandardMaterial({ color: 0x1c2444, roughness: 0.55, metalness: 0.35 })
);
plat.position.y = -0.3; scene.add(plat);
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(11, 0.07, 10, 80),
  new THREE.MeshStandardMaterial({ color: 0x1a2248, emissive: 0x3a5cff, emissiveIntensity: 1.4, metalness: 0.8, roughness: 0.3 })
);
rim.rotation.x = Math.PI / 2; rim.position.y = 0.02; scene.add(rim);

/* 星空背景 */
{
  const N = 700, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 42 + Math.random() * 32, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.9);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 6;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9db4ff, size: 0.14, transparent: true, opacity: 0.75, fog: false })));
}

/* ================= 物理常量 =================
   比例对齐真机：1 单位 ≈ 0.296m（底座 0.77m = 2.6 单位）
   搅拌室 Ø0.70m → R=1.18；摇奖球 Ø0.05m 真实比例过小，取 R=0.20 保证号码可读 */
const R_BALL = 0.15;
const G = 22;
const REST_BALL = 0.55;
const REST_WALL = 0.62;
const DT = 1 / 120;

const machines = [];
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb9c3e2, metalness: 1, roughness: 0.2, envMapIntensity: 1.3 });
const blueBase = new THREE.MeshPhysicalMaterial({ color: 0x2743d0, roughness: 0.3, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.18, envMapIntensity: 0.9 });
const blueDeep = new THREE.MeshPhysicalMaterial({ color: 0x1c2f9e, roughness: 0.38, metalness: 0.25, clearcoat: 1, clearcoatRoughness: 0.2, envMapIntensity: 0.8 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xaaccff, metalness: 0, roughness: 0.05,
  transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.06, envMapIntensity: 1.2
});
const acrylicMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfd8ff, metalness: 0, roughness: 0.08,
  transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false,
  clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.1
});

/* ============ 真机几何参数（对照 .ref/bing_10 高清全景 + bing_3 出球特写 + bing_12 官方标注图） ============
   比例：1 单位 ≈ 0.296m。底座 0.77m≈2.6u / 搅拌室 Ø0.70m→R=1.18 / 预览架管束比球高。
   底座 = 深蓝直筒圆柱（真机即如此，正面红色双色球 LOGO），顶面托透明亚克力底盘，玻璃球直接坐在上面。
   出球轨道 = 出球口下方一条贴着底座顶缘的透明短滑轨，球滑到轨端被取走（bing_3 特写），无横跨台面通道。
   预览架 = 一排竖直透明细管立在球壳顶部。 */
const MACH_CFG = [
  {
    key: 'red', cx: -3.8, cz: 0, count: 33, color: '#d0342c', label: '1 号机 · 红球区',
    R: 1.18, cy: 3.68,
    inletHalf: 60 * Math.PI / 180,             /* 搅拌室顶部大开口（管束正好跨在开口上，球垂直直落） */
    exitHalf: 10 * Math.PI / 180,              /* 出球口：下前方，口径略大于球（真机比例） */
    exitDir: new THREE.Vector3(0, -0.6, 0.8).normalize(),
    /* 搅拌器（专利 US6145836）：球底水平同轴双转子，中心盘 3 杆 + 外环盘 6 杆，反向不同速 */
    discY: 2.66, rHub: 0.31, rOuter: 0.6, wInner: 14, wOuter: -9,
    /* 出球轨道（对照 .ref/bing_3 特写）：两段透明单球管，绕台座弯到取球位 */
    rail: { r1: 0.94, y1: 2.6, s1: 0.167, phi1: 0.6, r2: 1.0, y2: 2.5, s2: 0.05, phiEnd: 1.25 },
    tubePitch: 0.34, tubeRowN: 7, tubeR: 0.17, tubeLoad: [5, 5, 5, 3, 5, 5, 5]   /* 单排管束跨在开口上：6×5+中心 3 = 33 */
  },
  {
    key: 'blue', cx: 3.8, cz: 0, count: 16, color: '#1e63c8', label: '2 号机 · 蓝球区',
    R: 1.18, cy: 3.68,
    inletHalf: 60 * Math.PI / 180,
    exitHalf: 10 * Math.PI / 180,
    exitDir: new THREE.Vector3(0, -0.6, 0.8).normalize(),
    /* 搅拌器（专利 US6145836）：球底水平同轴双转子，中心盘 3 杆 + 外环盘 6 杆，反向不同速 */
    discY: 2.66, rHub: 0.31, rOuter: 0.6, wInner: 14, wOuter: -9,
    tubePitch: 0.34, tubeRowN: 7, tubeR: 0.17, tubeLoad: [3, 2, 2, 2, 2, 2, 3],   /* 单排管束：3+4×2+3 = 16 */
    rail: { r1: 0.94, y1: 2.6, s1: 0.167, phi1: 0.6, r2: 1.0, y2: 2.5, s2: 0.05, phiEnd: 1.25 }
  },
];

/* ================= 号码球贴图：4 个白圆片号码（每 90° 一个） ================= */
function makeBallMesh(num, color) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = color; ctx.fillRect(0, 0, 512, 256);
  const grad = ctx.createRadialGradient(160, 70, 20, 256, 128, 280);
  grad.addColorStop(0, 'rgba(255,255,255,.30)'); grad.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 256);
  for (const cx of [64, 192, 320, 448]) {
    const disc = ctx.createRadialGradient(cx - 14, 114, 6, cx, 128, 58);
    disc.addColorStop(0, '#ffffff'); disc.addColorStop(0.8, '#f2f2f2'); disc.addColorStop(1, '#d8d8d8');
    ctx.fillStyle = disc;
    ctx.beginPath(); ctx.arc(cx, 128, 54, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 76px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(num, cx, 132);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.Mesh(
    new THREE.SphereGeometry(R_BALL, 24, 24),
    new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.26, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.12, envMapIntensity: 0.9 })
  );
}

/* ================= 底座正面：福彩标志圆牌 ================= */
function makeLogo(text) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 256, 256);
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd28a'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(128, 108, 86, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 84px "Microsoft YaHei", Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('福', 128, 106);
  ctx.fillStyle = '#ffd28a'; ctx.font = 'bold 30px "Microsoft YaHei", Arial';
  ctx.fillText(text, 128, 226);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ================= 构建真机结构（全部世界坐标，杜绝装配错位） ================= */
function buildMachine(cfg) {
  const { cx, cz, R, cy } = cfg;
  const cosInlet = Math.cos(cfg.inletHalf), cosExit = Math.cos(cfg.exitHalf);
  const sphBottom = cy - R;

  /* ---- ④ 底座：深蓝直筒圆柱（对照 bing_10 全景：等径圆柱、正面红色 LOGO、顶面透明亚克力底盘） ---- */
  const footRing = new THREE.Mesh(new THREE.CylinderGeometry(1.14, 1.18, 0.12, 48), blueDeep);
  footRing.position.set(cx, 0.06, cz); scene.add(footRing);
  const baseBody = new THREE.Mesh(new THREE.CylinderGeometry(1.05, 1.05, 2.44, 48), blueBase);
  baseBody.position.set(cx, 0.12 + 1.22, cz); scene.add(baseBody);           /* 顶面 y=2.50，正好托住玻璃球底 */
  const topTrim = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.045, 10, 64), blueDeep);
  topTrim.rotation.x = Math.PI / 2; topTrim.position.set(cx, 2.50, cz); scene.add(topTrim);
  const tray = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.12, 0.06, 48), acrylicMat);
  tray.position.set(cx, 2.53, cz); tray.renderOrder = 5; scene.add(tray);    /* 透明亚克力底盘 */
  const logo = new THREE.Mesh(new THREE.CircleGeometry(0.40, 40),
    new THREE.MeshStandardMaterial({ map: makeLogo(cfg.label), transparent: true, roughness: 0.5, emissive: 0x331111, emissiveIntensity: 0.4 }));
  logo.position.set(cx, 1.25, cz + 1.053);
  logo.rotation.x = -0.02; scene.add(logo);

  /* ---- ② 球状搅拌室（Ø0.70m）：透明玻璃球，顶部开口 + 下前方出球口（真挖洞） ---- */
  const t0 = cfg.inletHalf, t1 = Math.PI - cfg.exitHalf * 1.15;
  const main = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32, 0, Math.PI * 2, t0, t1 - t0), glassMat);
  main.position.set(cx, cy, cz); main.renderOrder = 6; scene.add(main);
  const phiHole = 0.64;
  const lowA = new THREE.Mesh(new THREE.SphereGeometry(R, 24, 14, Math.PI / 2 + phiHole, Math.PI * 2 - phiHole * 2, t1, Math.PI - t1), glassMat);
  lowA.position.set(cx, cy, cz); lowA.renderOrder = 6; scene.add(lowA);
  const lowB = new THREE.Mesh(new THREE.SphereGeometry(R, 12, 4, Math.PI / 2 - phiHole, phiHole * 2, t1, 0.1), glassMat);
  lowB.position.set(cx, cy, cz); lowB.renderOrder = 6; scene.add(lowB);
  const lowC = new THREE.Mesh(new THREE.SphereGeometry(R, 12, 4, Math.PI / 2 - phiHole, phiHole * 2, Math.PI - 0.2, 0.2), glassMat);
  lowC.position.set(cx, cy, cz); lowC.renderOrder = 6; scene.add(lowC);
  /* 赤道接缝（两个半球的可开合处） */
  const seam = new THREE.Mesh(new THREE.TorusGeometry(R, 0.018, 8, 64), blueDeep);
  seam.rotation.x = Math.PI / 2; seam.position.set(cx, cy, cz); scene.add(seam);

  /* 顶部开口金属环 + 滑动闸板（预览架挡板，管束就立在这块闸板上） */
  const plateY = cy + R * cosInlet;                       /* 开口环平面（= 球停高度基准） */
  const holeR = R * Math.sin(cfg.inletHalf);
  const inletRing = new THREE.Mesh(new THREE.TorusGeometry(holeR + 0.02, 0.035, 10, 48), metalMat);
  inletRing.rotation.x = Math.PI / 2;
  inletRing.position.set(cx, plateY, cz); scene.add(inletRing);
  const gateR = holeR + 0.18;
  const inletCap = new THREE.Mesh(new THREE.CylinderGeometry(gateR, gateR, 0.07, 48), blueDeep);
  inletCap.position.set(cx, plateY - 0.035, cz); scene.add(inletCap);
  /* 管束外圈固定环（管子插在环内，视觉上立住） */
  const rowSpan = (cfg.tubeRowN - 1) / 2 * cfg.tubePitch + cfg.tubeR * 2.2;
  const fixRing = new THREE.Mesh(new THREE.TorusGeometry(rowSpan, 0.028, 8, 48), metalMat);
  fixRing.rotation.x = Math.PI / 2; fixRing.position.set(cx, plateY + 0.04, cz); scene.add(fixRing);

  /* 出球口：球径大小的透明亚克力短管 + 透明翻板档杆（真机整个取球机构都是透明的） */
  const exR = R * Math.sin(cfg.exitHalf);
  const collarLen = 0.18;
  const exCollar = new THREE.Mesh(new THREE.CylinderGeometry(exR + 0.03, exR + 0.045, collarLen, 24, 1, true), acrylicMat);
  exCollar.renderOrder = 6;
  exCollar.position.set(cx, cy, cz).addScaledVector(cfg.exitDir, R + collarLen / 2 - 0.06);
  exCollar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  scene.add(exCollar);
  const valvePivot = new THREE.Group();
  valvePivot.position.set(cx, cy, cz).addScaledVector(cfg.exitDir, R + collarLen - 0.05);
  valvePivot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cfg.exitDir);
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(exR + 0.035, exR + 0.035, 0.035, 24),
    new THREE.MeshPhysicalMaterial({ color: 0xbfd8ff, metalness: 0, roughness: 0.08, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, envMapIntensity: 1.1 }));
  valve.position.y = 0.02; valve.renderOrder = 6; valvePivot.add(valve);
  scene.add(valvePivot);

  /* ---- 搅拌室底部：水平同轴双转子（专利 US6145836 FIG.2/3：中心盘 3 杆 + 外环盘 6 杆，
          同一平面同心布置，反向不同速旋转；转盘/轴为透明亚克力，拨杆为银色金属） ---- */
  const discSpins = [];
  const rotorY = cfg.discY;
  const brightMetal = new THREE.MeshStandardMaterial({ color: 0xdde4f5, metalness: 0.9, roughness: 0.28, envMapIntensity: 1.2 });
  /* 中心盘（3 根径向杆） */
  const inner = new THREE.Group();
  inner.position.set(cx, rotorY, cz); scene.add(inner);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rHub - 0.02, cfg.rHub - 0.02, 0.05, 32), acrylicMat);
  hub.position.y = 0.025; hub.renderOrder = 6; inner.add(hub);
  for (let k = 0; k < 3; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 3 * Math.PI * 2;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(cfg.rHub - 0.09, 0.05, 0.05), brightMetal);
    bar.position.set(0.05 + (cfg.rHub - 0.09) / 2, 0.075, 0);
    hold.add(bar); inner.add(hold);
  }
  discSpins.push(inner);
  /* 外环盘（6 根径向杆） */
  const outer = new THREE.Group();
  outer.position.set(cx, rotorY, cz); scene.add(outer);
  const ringShape = new THREE.Shape(); ringShape.absarc(0, 0, cfg.rOuter, 0, Math.PI * 2);
  const ringHole = new THREE.Path(); ringHole.absarc(0, 0, cfg.rHub + 0.012, 0, Math.PI * 2);
  ringShape.holes.push(ringHole);
  const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: 0.05, bevelEnabled: false, curveSegments: 48 });
  ringGeo.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, acrylicMat);
  ring.renderOrder = 6; outer.add(ring);
  const oBarLen = cfg.rOuter - cfg.rHub - 0.04;
  for (let k = 0; k < 6; k++) {
    const hold = new THREE.Group(); hold.rotation.y = k / 6 * Math.PI * 2;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(oBarLen, 0.05, 0.05), brightMetal);
    bar.position.set(cfg.rHub + 0.02 + oBarLen / 2, 0.075, 0);
    hold.add(bar); outer.add(hold);
  }
  discSpins.push(outer);
  /* 传动：中心轴 + 外环轴套（从底座顶伸上来，静止件） */
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.18, 10), brightMetal);
  axle.position.set(cx, rotorY - 0.09, cz); scene.add(axle);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rHub + 0.02, cfg.rHub + 0.02, 0.11, 32, 1, true),
    new THREE.MeshPhysicalMaterial({ color: 0xbfd8ff, metalness: 0, roughness: 0.08, transparent: true, opacity: 0.25, side: THREE.DoubleSide, depthWrite: false, clearcoat: 1, envMapIntensity: 1.1 }));
  sleeve.position.set(cx, rotorY - 0.055, cz); sleeve.renderOrder = 5; scene.add(sleeve);

  /* ---- ① 号码球预览架：单排竖直透明管束（对照真机 bing_10），球壳上的蓝色装饰子午环 ---- */
  const hoopY = cy + R + 0.07;
  const hoop = new THREE.Mesh(new THREE.TorusGeometry(R + 0.07, 0.035, 8, 72), blueDeep);
  hoop.rotation.y = 0; hoop.position.set(cx, cy, cz); scene.add(hoop);     /* 竖直子午环（x-y 平面） */
  const tubeDefs = [];
  const rowN = cfg.tubeRowN;
  for (let i = 0; i < rowN; i++) {
    tubeDefs.push({ x: (i - (rowN - 1) / 2) * cfg.tubePitch, z: 0, n: cfg.tubeLoad[i], y0: hoopY });
  }
  for (const td of tubeDefs) {
    const th = td.n * (R_BALL * 2) + 0.26;                 /* 管长按容量，管顶略高出球堆 */
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(cfg.tubeR, cfg.tubeR, th, 16, 1, true), acrylicMat);
    tube.position.set(cx + td.x, td.y0 + th / 2, cz + td.z);
    tube.renderOrder = 7; scene.add(tube);
  }

  /* ---- ③ 出球轨道（对照 .ref/bing_3 特写）：两段透明单球管，绕台座弯到取球位。
          上管绕亚克力柱（出口 → 侧前方），下管贴底座顶缘延续到取球点；只允许一球通过 ---- */
  {
    const P = cfg.rail;
    const tubePath = (r, ySurf, s, ph0, ph1) => {
      const pts = [];
      const N = 28;
      for (let i = 0; i <= N; i++) {
        const ph = ph0 + (ph1 - ph0) * i / N;
        pts.push(new THREE.Vector3(cx - Math.sin(ph) * r, ySurf - s * (ph - ph0) + R_BALL, cz + Math.cos(ph) * r));
      }
      return new THREE.CatmullRomCurve3(pts);
    };
    const tubeMat = new THREE.MeshPhysicalMaterial({
      color: 0xbfd8ff, metalness: 0, roughness: 0.08,
      transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false,
      clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.1
    });
    const t1 = new THREE.Mesh(new THREE.TubeGeometry(tubePath(P.r1, P.y1, P.s1, 0, P.phi1), 40, R_BALL + 0.035, 14, false), tubeMat);
    t1.renderOrder = 7; scene.add(t1);
    const t2 = new THREE.Mesh(new THREE.TubeGeometry(tubePath(P.r2, P.y2, P.s2, P.phi1, P.phiEnd), 40, R_BALL + 0.035, 14, false), tubeMat);
    t2.renderOrder = 7; scene.add(t2);
    /* 取球位挡块（透明小柱，球停在这里被取走） */
    const endX = cx - Math.sin(P.phiEnd) * P.r2, endZ = cz + Math.cos(P.phiEnd) * P.r2;
    const endY = P.y2 - P.s2 * (P.phiEnd - P.phi1) + R_BALL;
    const stopper = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 12), tubeMat);
    stopper.position.set(endX, endY + 0.02, endZ); stopper.renderOrder = 7; scene.add(stopper);
  }

  const glow = new THREE.PointLight(0xffffff, 0.6, R * 3.5);
  glow.position.set(cx, cy, cz); scene.add(glow);

  /* ---- 球：初始停在预览架竖管内（管内可叠多颗） ---- */
  const m = {
    ...cfg, discSpins, valvePivot, inletCap, tubeDefs,
    balls: [], agit: 0, agitTarget: 0,
    loadOpen: false, holeOpen: false,
    cosInlet, cosExit, exitDirW: cfg.exitDir.clone(),
    exitW: new THREE.Vector3(cx, cy, cz).addScaledVector(cfg.exitDir, R),
    doorAnim: 0,
    phase: 'idle', timer: 0, drawsLeft: cfg.key === 'red' ? 6 : 1,
    capturedBall: null, doneCount: 0,
  };
  let idx = 0;
  for (const td of tubeDefs) {
    for (let k = 0; k < td.n; k++) {
      const num = ++idx;
      if (num > cfg.count) break;
      const mesh = makeBallMesh(num, cfg.color);
      const p = new THREE.Vector3(cx + td.x, td.y0 + R_BALL + 0.02 + k * (R_BALL * 2 + 0.02), cz + td.z);
      const b = { num, p, v: new THREE.Vector3(), mesh, state: 'rack', placed: false, m };
      m.balls.push(b);
      mesh.position.copy(p);
      mesh.rotation.y = Math.random() * Math.PI * 2;
      scene.add(mesh);
    }
  }
  machines.push(m);
  return m;
}
MACH_CFG.forEach(buildMachine);

/* ================= HUD ================= */
const resultsEl = document.getElementById('results');
const phaseEl = document.getElementById('phase');
const slotEls = [];
for (let i = 0; i < 7; i++) {
  const d = document.createElement('div');
  d.className = 'slot ' + (i < 6 ? 'red' : 'blue');
  resultsEl.appendChild(d); slotEls.push(d);
}
function setPhase(t, active) { phaseEl.textContent = t; phaseEl.className = active ? 'active' : ''; }

/* ================= 物理 ================= */
const _rel = new THREE.Vector3(), _n = new THREE.Vector3(), _t = new THREE.Vector3(), _dir = new THREE.Vector3();

function stepInBall(b, m, dt) {
  const v = b.v, p = b.p;
  v.y -= G * dt;

  if (m.agit > 0.01) {
    /* 同轴双转子（专利 US6145836）：中心盘/外环盘反向不同速，切向拖带 + 拨杆弹跳 */
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rr = Math.hypot(dx, dz);
    if (Math.abs(p.y - m.discY) < 0.55) {
      const w = rr < m.rHub ? m.wInner : (rr < m.rOuter ? m.wOuter : 0);
      if (w !== 0) {
        const sp = w * m.agit * Math.min(rr, m.rOuter) * 1.3;
        v.x += -dz / (rr + 1e-4) * sp * dt;
        v.z += dx / (rr + 1e-4) * sp * dt;
        if (p.y < m.discY + 0.34 && p.y > m.discY - 0.16 && Math.random() < 0.24) {
          v.y += 7.5 * m.agit * dt * (0.5 + Math.random());
        }
      }
    }
  }

  if (m.holeOpen) {
    /* 出球口导流：把球堆引向洞口（其余球仍在搅拌） */
    _dir.subVectors(m.exitW, p);
    const dd = _dir.length();
    if (dd < m.R * 1.8) {
      v.addScaledVector(_dir.normalize(), 130 * (1 - dd / (m.R * 1.8)) * dt);
    }
  }

  const damp = m.agit > 0.01 ? 0.4 : 0.15;
  v.multiplyScalar(Math.max(0, 1 - damp * dt));
  p.addScaledVector(v, dt);

  /* 转子顶面支撑：球坐在双转子上（球心最低 = 盘顶 + R_BALL） */
  const floorC = m.discY + 0.05 + R_BALL;
  if (p.y < floorC) {
    p.y = floorC;
    if (v.y < -2.2) v.y *= -0.25; else v.y = 0;
  }

  /* 落球收拢：管束跨在开口上，球直落；仅对落到开口边缘外侧的球施加向心力 */
  if (m.loadOpen && p.y > m.cy + 0.4) {
    const dx = p.x - m.cx, dz = p.z - m.cz;
    const rho = Math.hypot(dx, dz);
    const maxRho = m.R * Math.sin(m.inletHalf) - R_BALL - 0.04;
    if (rho > maxRho && rho > 0.05) {
      v.x -= dx / rho * 30 * dt;
      v.z -= dz / rho * 30 * dt;
    }
  }

  /* 搅拌室玻璃约束：顶部入球口 / 下前方出球口可穿 */
  _rel.subVectors(p, _t.set(m.cx, m.cy, m.cz));
  const d = _rel.length();
  if (d > m.R - R_BALL) {
    _n.copy(_rel).divideScalar(d);
    const inInlet = m.loadOpen && _n.y > m.cosInlet;
    const inExit = m.holeOpen && _n.dot(m.exitDirW) > m.cosExit;
    if (inExit && d > m.R + R_BALL * 0.7 && !m.capturedBall) {
      b.state = 'rail'; b.placed = false;
      b.phi = 0; b.w = 1.4; b.seg2 = false;      /* 进入上管 */
      m.capturedBall = b;
      m.holeOpen = false;               /* 真机档杆动作：出一颗立即关阀 */
      /* 已显示过的球被"取走"（缩小消失，腾出单球管） */
      for (const ob of m.balls) if (ob !== b && ob.placed && !ob.dismiss) { ob.dismiss = true; ob.dismissT = 0; }
      return;
    }
    if (!inInlet && !inExit) {
      p.copy(_t).addScaledVector(_n, m.R - R_BALL);
      const vn = v.dot(_n);
      if (vn > 0) {
        v.addScaledVector(_n, -(1 + REST_WALL) * vn);
        v.multiplyScalar(0.985);
      }
    }
  }
}

/* 弧形双管轨道（对照 .ref/bing_3：两段透明单球管绕台座）：球沿圆弧滚动，管内一维排队 */
function railState(m, phi) {
  const P = m.rail;
  if (phi < P.phi1) return { r: P.r1, y: P.y1 - P.s1 * phi };
  return { r: P.r2, y: P.y2 - P.s2 * (phi - P.phi1) };
}

function stepRailBall(b, m, dt) {
  const P = m.rail, p = b.p, v = b.v;
  b.railT = (b.railT || 0) + dt;
  const st = railState(m, b.phi);
  const slope = b.phi < P.phi1 ? P.s1 : P.s2;
  b.w += G * slope / (st.r * st.r) * dt;       /* 重力沿弧切向分量 */
  b.w *= (1 - 0.8 * dt);                       /* 滚动阻尼 */
  b.phi += b.w * dt;
  if (b.phi < 0) { b.phi = 0; b.w *= -0.25; }              /* 管口 */
  if (b.phi > P.phiEnd) { b.phi = P.phiEnd; b.w *= -0.25; } /* 取球位挡块 */
  const st2 = railState(m, b.phi);
  p.x = m.cx - Math.sin(b.phi) * st2.r;
  p.z = m.cz + Math.cos(b.phi) * st2.r;
  p.y = st2.y + R_BALL;
  const vt = b.w * st2.r;
  v.set(-Math.cos(b.phi) * vt, 0, -Math.sin(b.phi) * vt);
  /* 停稳判定（管内停稳即入位；5s 超时保险）→ 入位显示 */
  if (!b.placed && ((b.railT > 1.5 && Math.abs(b.w) < 0.35) || b.railT > 5)) {
    b.placed = true;
    onBallPlaced(b, m);
  }
}

/* 管内一维碰撞：单球管内球排成单列 */
function collideRail(arr, m) {
  const P = m.rail;
  arr.sort((a, c) => a.phi - c.phi);
  const minD = (R_BALL * 2 + 0.02) / ((P.r1 + P.r2) / 2);
  for (let i = 0; i < arr.length - 1; i++) {
    const a = arr[i], c = arr[i + 1];
    const d = c.phi - a.phi;
    if (d < minD) {
      const push = (minD - d) / 2;
      a.phi = Math.max(0, a.phi - push);
      c.phi = Math.min(P.phiEnd, c.phi + push);
      if (a.w > c.w) { const t = a.w; a.w = c.w; c.w = t * 0.5; }
    }
  }
}

/* 球-球碰撞（同组） */
function collideGroup(arr) {
  for (let i = 0; i < arr.length; i++) {
    for (let j = i + 1; j < arr.length; j++) {
      const a = arr[i], b = arr[j];
      _rel.subVectors(b.p, a.p);
      const d = _rel.length(), min = R_BALL * 2;
      if (d > 1e-6 && d < min) {
        _n.copy(_rel).divideScalar(d);
        const overlap = min - d;
        a.p.addScaledVector(_n, -overlap * 0.5);
        b.p.addScaledVector(_n, overlap * 0.5);
        const rv = _dir.subVectors(b.v, a.v).dot(_n);
        if (rv < 0) {
          const imp = -(1 + REST_BALL) * rv * 0.5;
          a.v.addScaledVector(_n, -imp);
          b.v.addScaledVector(_n, imp);
        }
      }
    }
  }
}

/* ================= 流程控制（真机顺序，PLC 按固定搅拌间隔出球） ================= */
const state = { running: false, currentIdx: 0 };
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');

function startShow() {
  if (state.running) return;
  state.running = true;
  state.currentIdx = 0;
  startBtn.disabled = true; resetBtn.disabled = true;
  beginMachine(machines[0]);
}
function beginMachine(m) {
  m.phase = 'loading'; m.timer = 0; m.doorAnim = 0;
  setPhase(m.key === 'red' ? '预览架挡板开启 · 号码球落入搅拌室' : '蓝球机：预览架挡板开启 · 落球', true);
}
function onBallPlaced(b, m) {
  const totalIdx = m.key === 'red' ? m.doneCount : 6;
  const el = slotEls[totalIdx];
  if (el) { el.textContent = b.num; el.classList.add('filled', 'pop'); }
  m.doneCount++;
  b.faceTimer = 0;
}

function updateMachine(m, dt) {
  m.timer += dt;
  if (m.phase === 'loading') {
    m.doorAnim = Math.min(1, m.doorAnim + dt / 0.7);
    m.inletCap.position.x = m.doorAnim * m.R * 1.5;
    if (m.doorAnim >= 1 && !m.loadOpen) {
      m.loadOpen = true;
      for (const b of m.balls) { b.state = 'in'; b.v.set(-(b.p.x - m.cx) * 2.0, -1.5, -(b.p.z - m.cz) * 2.0); }
    }
    if (m.loadOpen && m.balls.every(b => b.p.y < m.cy - 0.1)) {
      m.loadOpen = false;
      m.inletCap.position.x = 0;
      m.phase = 'stir'; m.timer = 0; m.agitTarget = 1;
      setPhase('搅拌底盘双向旋转 · 充分搅拌中', true);
    }
  } else if (m.phase === 'stir') {
    if (m.timer > 3) {
      m.phase = 'draw'; m.timer = 0; m.holeOpen = true;
      setPhase('出球口档杆开启 · 等待出球', true);
    }
  } else if (m.phase === 'draw') {
    if (m.timer > 3.5 && !m.capturedBall) {
      /* 防堵兜底：给最靠近出口的球一个物理冲量 + 全场抖动（模拟真机持续搅拌防颗粒拱） */
      let best = null, bd = 1e9;
      for (const b of m.balls) {
        if (b.state !== 'in') continue;
        const d = b.p.distanceTo(m.exitW);
        if (d < bd) { bd = d; best = b; }
      }
      if (best) {
        _dir.subVectors(m.exitW, best.p).normalize();
        best.v.addScaledVector(_dir, 7);
      }
      for (const b of m.balls) {
        if (b.state !== 'in') continue;
        b.v.x += (Math.random() - 0.5) * 3;
        b.v.y += Math.random() * 2.5;
        b.v.z += (Math.random() - 0.5) * 3;
      }
      m.timer = 1.5;
    }
    if (m.capturedBall && m.capturedBall.placed) {
      m.capturedBall = null;
      m.drawsLeft--;
      if (m.drawsLeft > 0) {
        m.phase = 'stir'; m.timer = 0;
        setPhase('其余球持续搅拌 · 准备下一球', true);
      } else {
        m.phase = 'done'; m.agitTarget = 0.12;
      }
    }
  } else if (m.phase === 'done') {
    if (state.currentIdx < machines.length - 1) {
      state.currentIdx++;
      beginMachine(machines[state.currentIdx]);
    } else if (machines.every(mm => mm.phase === 'done')) {
      state.running = false;
      startBtn.disabled = true; resetBtn.disabled = false;
      setPhase('本期开奖完成', false);
    }
  }

  m.agit += (m.agitTarget - m.agit) * Math.min(1, dt * 2);
  if (m.agit > 0.01) {
    for (let i = 0; i < 2; i++) m.discSpins[i].rotation.y += (i === 0 ? 14 : -9) * m.agit * dt;
  }
  m.valvePivot.rotation.x = -(m.holeOpen ? 1 : 0) * 1.5;

  /* 球物理 */
  const inBalls = [], railBalls = [];
  for (const b of m.balls) {
    if (b.state === 'in') { stepInBall(b, m, DT); inBalls.push(b); }
    else if (b.state === 'rail') { stepRailBall(b, m, DT); railBalls.push(b); }
  }
  collideGroup(inBalls);
  collideRail(railBalls, m);

  /* mesh 同步 + 滚动旋转 */
  for (const b of m.balls) {
    if (b.state === 'rack') continue;
    if (b.dismiss) {                           /* 已显示的球被取走：缩小消失 */
      b.dismissT += dt;
      const k = Math.max(0.001, 1 - b.dismissT / 0.45);
      b.mesh.scale.setScalar(k);
      if (k <= 0.001) b.mesh.visible = false;
      b.mesh.position.copy(b.p);
      continue;
    }
    if (b.placed) {
      b.faceTimer = (b.faceTimer ?? 0) + dt;
      const k = Math.min(1, b.faceTimer / 0.4);
      b.mesh.rotation.x *= (1 - k);
      b.mesh.rotation.z *= (1 - k);
      b.mesh.rotation.y += (-Math.PI / 4 - b.mesh.rotation.y) * k;
    } else {
      const sp = Math.hypot(b.v.x, b.v.z);
      if (sp > 0.05) {
        b.mesh.rotation.x -= b.v.z / R_BALL * DT * 0.9;
        b.mesh.rotation.z += b.v.x / R_BALL * DT * 0.9;
      }
    }
    b.mesh.position.copy(b.p);
  }
}

/* ================= 重置 ================= */
function resetAll() {
  for (const m of machines) {
    m.phase = 'idle'; m.agit = 0; m.agitTarget = 0;
    m.loadOpen = false; m.holeOpen = false;
    m.capturedBall = null; m.doneCount = 0; m.timer = 0;
    m.doorAnim = 0; m.valvePivot.rotation.x = 0;
    m.inletCap.position.x = 0;
    m.drawsLeft = m.key === 'red' ? 6 : 1;
    let idx = 0;
    for (const td of m.tubeDefs) {
      for (let k = 0; k < td.n; k++) {
        const b = m.balls[idx++];
        if (!b) break;
        b.p.set(m.cx + td.x, td.y0 + R_BALL + 0.02 + k * (R_BALL * 2 + 0.02), m.cz + td.z);
        b.v.set(0, 0, 0);
        b.state = 'rack'; b.placed = false; b.faceTimer = 0; b.railT = 0;
        b.phi = 0; b.w = 0; b.seg2 = false; b.dismiss = false; b.dismissT = 0;
        b.mesh.visible = true; b.mesh.scale.setScalar(1);
        b.mesh.position.copy(b.p);
        b.mesh.rotation.set(0, Math.random() * Math.PI * 2, 0);
      }
    }
  }
  for (const el of slotEls) { el.textContent = ''; el.classList.remove('filled', 'pop'); }
  state.running = false;
  startBtn.disabled = false; resetBtn.disabled = true;
  setPhase('点击「开始摇奖」', false);
}
resetBtn.disabled = true;
startBtn.addEventListener('click', startShow);
resetBtn.addEventListener('click', resetAll);

/* ================= 主循环 ================= */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.running || machines.some(m => m.balls.some(b => b.state !== 'rack' && (!b.placed || b.faceTimer < 0.5)))) {
    for (const m of machines) {
      if (m.phase !== 'idle') updateMachine(m, dt);
      else {
        for (const b of m.balls) if (b.placed && b.faceTimer < 0.5) {
          b.faceTimer += dt;
          const k = Math.min(1, b.faceTimer / 0.4);
          b.mesh.rotation.y += (-Math.PI / 4 - b.mesh.rotation.y) * k;
          b.mesh.position.copy(b.p);
        }
      }
    }
  }
  controls.update();
  composer.render();
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
